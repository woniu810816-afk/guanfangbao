<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="房东之友">
  <title>房东之友</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#111; --sub:#86909c; --primary:#3b6ef6; --danger:#f53f3f; --success:#00b42a; --warn:#ff7d00; --border:#eee; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    body { background:var(--bg); color:var(--text); padding-bottom:75px; user-select:none; }
    .navbar { position:sticky; top:0; z-index:100; background:var(--card); height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:17px; font-weight:700; border-bottom:1px solid var(--border); }
    .sync-badge { font-size:12px; font-weight:500; color:var(--success); background:#e8ffea; padding:4px 10px; border-radius:12px; cursor:pointer; }
    .container { padding:12px 14px; }
    .section-title { font-size:16px; font-weight:700; margin:8px 2px 10px; color:#111; display:flex; justify-content:space-between; align-items:center; }
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .stat-card { background:var(--card); border-radius:10px; padding:14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.03); }
    .stat-label { font-size:14px; color:#444; line-height:1.4; }
    .stat-num { font-size:22px; font-weight:700; }
    .workbench-card { background:var(--card); border-radius:12px; padding:20px 10px 14px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px 8px; box-shadow:0 1px 4px rgba(0,0,0,0.03); }
    .wb-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
    .wb-icon { width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:21px; font-weight:700; margin-bottom:6px; }
    .wb-label { font-size:13px; color:#333; font-weight:500; }
    .tabbar { position:fixed; bottom:0; left:0; right:0; height:56px; background:var(--card); display:flex; border-top:1px solid var(--border); z-index:100; }
    .tab-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--sub); font-size:11px; cursor:pointer; }
    .tab-item.active { color:var(--primary); font-weight:700; }
    .tab-icon { font-size:20px; margin-bottom:2px; }
    .modal { position:fixed; inset:0; background:var(--bg); z-index:200; overflow-y:auto; display:none; padding-bottom:80px; }
    .modal.show { display:block; }
    .modal-lv3 { z-index:250; }
    .modal-header { position:sticky; top:0; background:var(--card); height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; border-bottom:1px solid var(--border); font-weight:700; font-size:16px; z-index:20; }
    .back-btn { font-size:22px; cursor:pointer; color:#111; width:60px; font-weight:500; }
    .room-tabs { display:flex; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:15; }
    .r-tab { flex:1; text-align:center; padding:12px 0; font-size:13px; color:var(--sub); cursor:pointer; position:relative; }
    .r-tab.active { color:var(--primary); font-weight:700; }
    .r-tab.active::after { content:''; position:absolute; bottom:0; left:25%; right:25%; height:3px; background:var(--primary); border-radius:2px; }
    .search-bar { background:var(--card); padding:8px 12px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--border); }
    .search-input { flex:1; background:var(--bg); border:1px solid #e5e5e5; border-radius:6px; padding:8px 10px; font-size:14px; outline:none; }
    .card-list { padding:10px 12px; }
    .item-card { background:var(--card); border-radius:10px; padding:14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.03); cursor:pointer; }
    .item-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-weight:700; font-size:15px; }
    .badge { font-size:11px; padding:2px 7px; border-radius:4px; font-weight:500; }
    .badge.green { background:#e8ffea; color:var(--success); }
    .badge.red { background:#ffece8; color:var(--danger); }
    .badge.orange { background:#fff4e8; color:var(--warn); }
    .badge.blue { background:#e8f3ff; color:var(--primary); }
    .item-row { font-size:13px; color:var(--sub); margin:5px 0; display:flex; justify-content:space-between; align-items:center; }
    .room-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 12px; }
    .room-box { background:#ffeef0; border-radius:10px; padding:12px; cursor:pointer; }
    .room-box.rented { background:#e6f9ed; }
    .cell-group { background:var(--card); border-radius:10px; margin:0 12px 12px; padding:0 14px; }
    .cell-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .cell-row:last-child { border-bottom:none; }
    .cell-label { color:#111; min-width:95px; }
    .req { color:var(--danger); margin-left:2px; }
    .cell-input, .cell-select { flex:1; border:none; text-align:right; font-size:14px; color:#111; background:transparent; outline:none; }
    .btn { width:100%; padding:11px; border:none; border-radius:22px; background:var(--primary); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    .btn-outline { background:#eef3fe; color:var(--primary); }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-sm { padding:5px 10px; font-size:12px; border-radius:6px; border:none; cursor:pointer; background:#f0f2f5; color:#333; margin-left:4px; }
    .btn-sm.primary { background:var(--primary); color:#fff; }
    .btn-sm.success { background:var(--success); color:#fff; }
    .btn-sm.danger { background:var(--danger); color:#fff; }
    .action-sheet { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:400; display:none; flex-direction:column; justify-content:flex-end; }
    .action-sheet.show { display:flex; }
    .action-panel { background:var(--card); border-radius:16px 16px 0 0; padding:18px; max-height:85vh; overflow-y:auto; }
    .receipt-table { width:100%; border-collapse:collapse; margin:10px 0; font-size:13px; text-align:center; }
    .receipt-table th { background:#ffe8d6; color:#333; padding:8px 4px; border:1px solid #f0d8c8; }
    .receipt-table td { padding:8px 4px; border:1px solid #eee; }
    .empty-tip { text-align:center; color:var(--sub); padding:40px 0; font-size:13px; }
  </style>
</head>
<body>

  <div class="navbar">
    <span style="font-size:13px;color:var(--primary);" id="role-tag">👑 主房东</span>
    <span id="app-title">房东之友</span>
    <span class="sync-badge" id="sync-status" onclick="syncFromCloud(true)">☁️ 已同步</span>
  </div>

  <!-- 1. 工作台首页 -->
  <div id="tab-workbench" class="container">
    <div class="section-title"><span>数据预览</span><span style="font-size:11px;color:var(--success);font-weight:500;">● 触控引擎已就绪</span></div>
    <div class="stats-grid">
      <div class="stat-card" onclick="openModule('rooms','ALL')"><div class="stat-label">全部<br>房间数</div><div class="stat-num" id="st-total">0</div></div>
      <div class="stat-card" onclick="openModule('rooms','vacant')"><div class="stat-label">空房数 ›</div><div class="stat-num" style="color:var(--danger)" id="st-vacant">0</div></div>
      <div class="stat-card" onclick="openModule('rooms','expiring')"><div class="stat-label">快到期 ›<br>房间数</div><div class="stat-num" id="st-expiring">0</div></div>
      <div class="stat-card" onclick="openModule('bills','unpaid')"><div class="stat-label">今日要收 ›<br>租房间数</div><div class="stat-num" style="color:var(--primary)" id="st-due">0</div></div>
    </div>
    <div class="section-title">工作台</div>
    <div class="workbench-card">
      <div class="wb-item" onclick="openModule('rooms','ALL')"><div class="wb-icon" style="background:#5396ff">🏢</div><div class="wb-label">我的房源</div></div>
      <div class="wb-item" onclick="openModule('contracts')"><div class="wb-icon" style="background:#c55df6">📄</div><div class="wb-label">租客/合同</div></div>
      <div class="wb-item" onclick="openModule('recruit')"><div class="wb-icon" style="background:#ff9d5c">租</div><div class="wb-label">招租</div></div>
      <div class="wb-item" onclick="openModule('sign')"><div class="wb-icon" style="background:#ff7e47">✍️</div><div class="wb-label">租客签约</div></div>
      <div class="wb-item" onclick="openModule('bills','ALL')"><div class="wb-icon" style="background:#6467f0">¥</div><div class="wb-label">收租/账单</div></div>
      <div class="wb-item" onclick="openModule('checkout')"><div class="wb-icon" style="background:#f25781">退</div><div class="wb-label">退租</div></div>
      <div class="wb-item" onclick="openModule('repairs')"><div class="wb-icon" style="background:#148e99">🛠️</div><div class="wb-label">报修</div></div>
      <div class="wb-item" onclick="openBulkMeter()"><div class="wb-icon" style="background:#20b2aa">⚡</div><div class="wb-label">集中抄表</div></div>
      <div class="wb-item" onclick="switchTab('stats',document.querySelectorAll('.tab-item')[1])"><div class="wb-icon" style="background:#00b42a">📊</div><div class="wb-label">财务统计</div></div>
    </div>
  </div>

  <!-- 2. 统计页 -->
  <div id="tab-stats" class="container" style="display:none;"></div>

  <!-- 3. 消息通知页 -->
  <div id="tab-msg" class="container" style="display:none;">
    <div class="section-title">消息通知</div>
    <div id="msg-list"></div>
  </div>

  <!-- 4. 我的页面 -->
  <div id="tab-mine" class="container" style="display:none;">
    <div class="item-card" style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:16px;font-weight:700;" id="cur-user-title">👑 主房东</div>
        <div style="font-size:13px;color:var(--sub);margin-top:4px;" id="cur-user-phone"></div>
      </div>
      <button class="btn-sm" onclick="switchAccountPrompt()">切换手机号</button>
    </div>
    <div class="section-title">管房组与管家权限</div>
    <div class="item-card">
      <div id="manager-admin-panel" style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;background:#fff8e6;padding:8px 10px;border-radius:6px;margin-bottom:10px;font-size:12px;">
          <span>🔒 限制管家权限（禁删房源/禁看总账）</span>
          <input type="checkbox" id="restrict-mgr-chk" onchange="toggleMgrRestrict(this.checked)" style="width:18px;height:18px;">
        </div>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <input id="m-name" class="search-input" style="flex:1" placeholder="管家称呼">
          <input id="m-phone" type="tel" class="search-input" style="flex:1.4" placeholder="管家手机号">
        </div>
        <button class="btn" onclick="addManager()">+ 添加管房员手机号</button>
      </div>
      <div id="managers-list-box"></div>
    </div>
    <div class="section-title">本地数据备份</div>
    <div class="item-card">
      <button class="btn btn-outline" onclick="exportData()" style="margin-bottom:8px;">📤 导出备份文件 (.json)</button>
      <label class="btn btn-outline" style="display:block;text-align:center;">📥 从备份文件恢复<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
    </div>
  </div>

  <!-- 二级页面弹窗 -->
  <div id="module-modal" class="modal">
    <div class="modal-header"><span class="back-btn" onclick="closeModule()">‹ 返回</span><span id="modal-title">详情</span><span style="width:60px;"></span></div>
    <div id="modal-body"></div>
  </div>

  <!-- 三级/四级页面弹窗 (带4个Tab) -->
  <div id="lv3-modal" class="modal modal-lv3">
    <div class="modal-header"><span class="back-btn" onclick="closeLv3()">‹ 返回</span><span id="lv3-title">详情</span><span style="width:60px;"></span></div>
    <div id="lv3-tabs" class="room-tabs" style="display:none;">
      <div class="r-tab active" onclick="switchRoomTab('basic',this)">房间基本信息</div>
      <div class="r-tab" onclick="switchRoomTab('tenant',this)">租客信息</div>
      <div class="r-tab" onclick="switchRoomTab('contract',this)">合同信息</div>
      <div class="r-tab" onclick="switchRoomTab('bills',this)">账单信息</div>
    </div>
    <div id="lv3-body"></div>
  </div>

  <!-- 底部滑出操作面板 -->
  <div id="action-sheet" class="action-sheet">
    <div class="action-panel">
      <div style="font-size:16px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">
        <span id="action-title-text">操作</span>
        <span style="font-size:22px;color:var(--sub);cursor:pointer;padding:0 6px;" onclick="closeAction()">×</span>
      </div>
      <div id="action-body"></div>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <div class="tabbar" id="main-tabbar">
    <div class="tab-item active" onclick="switchTab('workbench',this)"><div class="tab-icon">❖</div>工作台</div>
    <div class="tab-item" onclick="switchTab('stats',this)"><div class="tab-icon">📈</div>统计</div>
    <div class="tab-item" onclick="switchTab('msg',this)"><div class="tab-icon">🔔</div>消息通知</div>
    <div class="tab-item" onclick="switchTab('mine',this)"><div class="tab-icon">👤</div>我的</div>
  </div>

<script>
  // 1. 新加坡 Supabase 配置 (已修正 eyJ 小写开头)
  const SP_URL = 'https://stsfiyzfyfwpbqjkrwbl.supabase.co';
  const SP_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0c2ZpeXpmeWZ3cGJxamtyd2JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTI5NzIsImV4cCI6MjEwOTEyODk3Mn0.TuPWBTPMmi9y06XQAGZsxaTq7vTijyuwRI3pktXBrAQ';
  const STORAGE_KEY = 'FDZY_SUPA_DB_V6', LOGIN_KEY = 'FDZY_PHONE_V6';
  const FEE_OPTIONS = ['卫生管理费','电梯费','电视费','网络费','物业费','钥匙押金','燃气'];

  let currentPhone = localStorage.getItem(LOGIN_KEY) || '13590174063';
  let activeRoomIdx = -1, roomFilter = 'ALL', activeBuilding = 'ALL', billFilter = 'ALL', contractTab = 'active', repairTab = 'pending';
  let tempSignFees = [], tempCoRefunds = [], tempCoCharges = [];

  let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {
    adminPhone:'13590174063', restrictMgr:false, managers:[], rooms:[], pastTenants:[], bills:[], repairs:[], expenses:[], ledger:[], scanCount:0
  };

  function isBoss(){ return !db.adminPhone || currentPhone === db.adminPhone; }
  function canEditCritical(){ return isBoss() || !db.restrictMgr; }

  function setSyncBadge(t, warn){
    const el = document.getElementById('sync-status');
    if(el){ el.innerText = t; el.style.color = warn ? 'var(--warn)' : 'var(--success)'; el.style.background = warn ? '#fff4e8' : '#e8ffea'; }
  }

  async function syncFromCloud(manual){
    setSyncBadge('🔄 同步中', true);
    try {
      const res = await fetch(`${SP_URL}/rest/v1/store?id=eq.1&select=data`, { headers: { 'apikey': SP_KEY, 'Authorization': `Bearer ${SP_KEY}` }
      });
      if(!res.ok) throw new Error();
      const rows = await res.json();
      if(rows.length > 0 && rows[0].data){
        db = Object.assign({adminPhone:'13590174063',restrictMgr:false,managers:[],rooms:[],pastTenants:[],bills:[],repairs:[],expenses:[],ledger:[],scanCount:0}, rows[0].data);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } else {
        await saveDB();
      }
      setSyncBadge('☁️ 已同步', false);
      if(manual) alert('已从新加坡云数据库同步最新数据！');
      refreshDashboard();
    } catch(e) {
      setSyncBadge('⚠️ 本地模式', true);
      refreshDashboard();
    }
  }

  async function saveDB(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    refreshDashboard();
    setSyncBadge('🔄 保存中', true);
    try {
      const res = await fetch(`${SP_URL}/rest/v1/store`, { method: 'POST', headers: { 'apikey': SP_KEY, 'Authorization': `Bearer ${SP_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify({ id: 1, data: db })
      });
      if(res.ok) setSyncBadge('☁️ 已同步', false);
      else throw new Error();
    } catch(e) { setSyncBadge('⚠️ 待同步', true); }
  }

  function closeModule(){ document.getElementById('module-modal').classList.remove('show'); refreshDashboard(); }
  function closeLv3(){ document.getElementById('lv3-modal').classList.remove('show'); document.getElementById('lv3-tabs').style.display='none'; }
  function closeAction(){ document.getElementById('action-sheet').classList.remove('show'); }

  function refreshDashboard(){
    document.getElementById('role-tag').innerText = isBoss() ? '👑 主房东' : '👤 管房员';
    const total = db.rooms.length;
    const vacant = db.rooms.filter(r => r.status === 'vacant').length;
    let exp = 0; const today = new Date();
    db.rooms.filter(r => r.status === 'rented').forEach(r => {
      if(r.endDate){ const d = (new Date(r.endDate) - today)/86400000; if(d <= 30 && d >= -30) exp++; }
    });
    const due = db.bills.filter(b => b.status !== 'paid').length;
    document.getElementById('st-total').innerText = total;
    document.getElementById('st-vacant').innerText = vacant;
    document.getElementById('st-expiring').innerText = exp;
    document.getElementById('st-due').innerText = due;

    let msgs = [];
    db.bills.filter(b => b.status !== 'paid').forEach(b => {
      const bIdx = db.bills.findIndex(x => x.id === b.id);
      msgs.push(`<div class="item-card" onclick="openModule('bills','ALL');openMeterForm(${bIdx})">
        <div class="item-header"><span>抄表通知 <span style="color:var(--danger)">●</span></span><span style="font-size:12px;color:var(--sub);font-weight:400;">${b.date||b.month}</span></div>
        <div class="item-row" style="color:#333;"><span>老板您好，${b.roomName} 房间在 ${b.month} 的收租账单已生成，请及时去抄表收租！</span></div>
        <div style="text-align:right;margin-top:6px;"><span style="color:var(--primary);font-size:13px;font-weight:600;">去抄表 ›</span></div>
      </div>`);
    });
    db.repairs.filter(r => r.status === 'pending').forEach(r => {
      msgs.push(`<div class="item-card" onclick="openModule('repairs')">
        <div class="item-header"><span>报修通知 <span style="color:var(--warn)">●</span></span><span style="font-size:12px;color:var(--sub);font-weight:400;">${r.date}</span></div>
        <div class="item-row" style="color:#333;"><span>[${r.type}] ${r.roomName}：${r.desc}</span></div>
      </div>`);
    });
    document.getElementById('msg-list').innerHTML = msgs.length ? msgs.join('') : '<div class="empty-tip">暂无消息通知</div>';
    renderStatsTab();
    renderManagersSection();
  }

  // --- 模块路由入口 ---
  function openModule(type, filter='ALL'){
    document.getElementById('module-modal').classList.add('show');
    if(type === 'rooms'){ roomFilter = filter; renderBuildingsPage(); }
    else if(type === 'contracts') renderContractsPage();
    else if(type === 'recruit') renderRecruitPage();
    else if(type === 'sign') renderSignPage();
    else if(type === 'bills'){ billFilter = filter; renderBillsPage(); }
    else if(type === 'checkout') openCheckoutHome();
    else if(type === 'repairs') renderRepairsPage();
  }

  // --- 1. 我的房源：二级楼栋汇总 + 三级房间方格列表 + 四级房间详情(4个Tab) ---
  function renderBuildingsPage(){
    document.getElementById('modal-title').innerText = '我的房源/楼栋';
    const bldgs = {};
    db.rooms.forEach(r => {
      const b = r.building || '默认楼栋';
      if(!bldgs[b]) bldgs[b] = { total:0, vacant:0 };
      bldgs[b].total++;
      if(r.status === 'vacant') bldgs[b].vacant++;
    });
    const keys = Object.keys(bldgs);
    const bldgCards = keys.map(k => `
      <div class="item-card" style="width:48%;display:inline-block;margin-right:2%;" onclick="activeBuilding='${k}';renderRoomsPage()">
        <div style="font-size:16px;font-weight:700;margin-bottom:6px;">${k}</div>
        <div style="font-size:13px;color:var(--sub);">总房间数：${bldgs[k].total}</div>
        <div style="font-size:13px;color:var(--sub);margin-top:2px;">空房数：${bldgs[k].vacant}</div>
      </div>`).join('');

    document.getElementById('modal-body').innerHTML = `
      <div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--border);">
        <span style="font-weight:700;">🏢 楼栋 (${keys.length})</span>
        <button class="btn-sm primary" onclick="openAddRoomSheet()">+ 添加楼栋/房间</button>
      </div>
      <div style="padding:12px 14px;">${bldgCards || '<div class="empty-tip">暂无楼栋，请点击右上角添加</div>'}</div>

      </div>

  function renderRoomsGridOnly(){
    const today = new Date();
    const list = db.rooms.filter(r => {
      if(activeBuilding !== 'ALL' && r.building !== activeBuilding) return false;
      if(roomFilter === 'vacant') return r.status === 'vacant';
      if(roomFilter === 'rented') return r.status === 'rented';
      if(roomFilter === 'expiring'){
        if(r.status !== 'rented' || !r.endDate) return false;
        const d = (new Date(r.endDate) - today)/86400000;
        return d <= 30 && d >= -30;
      }
      return true;
    });
    const box = document.getElementById('rooms-list-box');
    if(!box) return;
    box.innerHTML = list.length ? `<div class="room-grid">` + list.map(r => {
      const idx = db.rooms.findIndex(x => x.id === r.id);
      return `<div class="room-box ${r.status==='rented'?'rented':''}" onclick="openRoomTabs(${idx})">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-size:17px;font-weight:700;">${r.name}</span>
          <span class="badge ${r.status==='vacant'?'red':'green'}" style="background:${r.status==='vacant'?'#e54d42':'#00b42a'};color:#fff;">${r.status==='vacant'?'空房':'已租'}</span>

        <div style="font-size:12px;color:#555;margin:3px 0;">${r.rent?('租金 ¥'+r.rent+'/月'):'未录入租金'}</div>
        <div style="font-size:11px;color:${r.status==='vacant'?'var(--danger)':'#00802b'}">${r.status==='vacant'?((r.vacantSince||'近期')+'开始空房'):('租客: '+r.tenant)}</div>

    }).join('') + `</div>` : '<div class="empty-tip">暂无符合条件的房间</div>';

  function addSingleRoomExec(){
    const b = document.getElementById('ar-bldg').value.trim()||'5栋';
    const n = document.getElementById('ar-single').value.trim();
    if(!n) return alert('请输入房间号！');
    const rent = Number(document.getElementById('ar-rent').value||1000);
    const wp = Number(document.getElementById('ar-wp').value||5), ep = Number(document.getElementById('ar-ep').value||1);
    db.rooms.push({ id:'RM_'+Date.now(), building:b, name:n, rent, waterPrice:wp, elecPrice:ep, lastWater:0, lastElec:0, vacantSince:new Date().toISOString().slice(0,10), status:'vacant' });
    saveDB(); closeAction(); activeBuilding = b; renderRoomsPage();
  }

  function bulkCreateRoomsExec(){
    const b = document.getElementById('ar-bldg').value.trim()||'5栋';
    const f = Number(document.getElementById('ar-floors').value||1), p = Number(document.getElementById('ar-per').value||8);
    const rent = Number(document.getElementById('ar-rent').value||1000);
    const wp = Number(document.getElementById('ar-wp').value||5), ep = Number(document.getElementById('ar-ep').value||1);
    const td = new Date().toISOString().slice(0,10);
    for(let i=1; i<=f; i++){
      for(let j=1; j<=p; j++){
        const rmNo = `${i}${j<10?'0'+j:j}`;
        db.rooms.push({ id:'RM_'+Date.now()+'_'+i+'_'+j, building:b, name:rmNo, floor:i, rent, waterPrice:wp, elecPrice:ep, lastWater:0, lastElec:0, vacantSince:td, status:'vacant' });
      }
    }
    saveDB(); closeAction(); activeBuilding = b; renderRoomsPage();
  }

  function syncSignUI(){
    const rm = db.rooms.find(r => r.id === document.getElementById('s-rm').value);
    if(rm){
      document.getElementById('s-rent').value = rm.rent||1000;
      document.getElementById('s-dep').value = rm.rent||1000;
      document.getElementById('s-wp').value = rm.waterPrice||8;
      document.getElementById('s-ep').value = rm.elecPrice||1;
    }
  }

  function openFeeSelector(){
    document.getElementById('action-sheet').classList.add('show');
    document.getElementById('action-title-text').innerText = '添加/删除费用项目';
    document.getElementById('action-body').innerHTML = `
      <div style="font-size:12px;color:var(--sub);margin-bottom:8px;">请在需要收费的项目右边打勾，并按“保存设置”</div>

      </div>
      <button class="btn" onclick="closeAction();renderSignExtraFees()">保存设置</button>`;
  }

  function toggleSignFee(name){
    const idx = tempSignFees.findIndex(x => x.name === name);
    if(idx >= 0) tempSignFees.splice(idx, 1);
    else {
      const amt = Number(prompt(`请输入【${name}】每月金额（元）：`, '30')||30);
      tempSignFees.push({ name, amt });
    }
    openFeeSelector();
  }

  function renderSignExtraFees(){
    const box = document.getElementById('s-extra-box');
    if(box) box.innerHTML = tempSignFees.map(f => `<div class="cell-row"><span class="cell-label">${f.name}</span><span>¥${f.amt} 元/月</span></div>`).join('');
  }

  function submitSign(){
    const nm = document.getElementById('s-name').value.trim(), ph = document.getElementById('s-phone').value.trim();
    if(!nm || !ph) return alert('请填写租客姓名与手机号！');
    const rm = db.rooms.find(r => r.id === document.getElementById('s-rm').value);
    const start = document.getElementById('s-start').value, end = document.getElementById('s-end').value;
    rm.status = 'rented'; rm.tenant = nm; rm.phone = ph;
    rm.idCard = document.getElementById('s-id').value.trim();
    rm.idAddr = document.getElementById('s-addr').value.trim();
    rm.startDate = start; rm.endDate = end;
    rm.cycle = document.getElementById('s-cycle').value;
    rm.billMode = document.getElementById('s-bmode').value;
    rm.rent = Number(document.getElementById('s-rent').value||1000);
    rm.deposit = Number(document.getElementById('s-dep').value||1000);
    rm.waterPrice = Number(document.getElementById('s-wp').value||8);
    rm.elecPrice = Number(document.getElementById('s-ep').value||1);
    rm.extraFees = [...tempSignFees];
    rm.contractNo = new Date().toISOString().slice(0,10).replace(/-/g,'') + '001';
    rm.signDate = new Date().toISOString().slice(0,10);

    const exSum = rm.extraFees.reduce((s,f)=>s+f.amt,0);
    // 生成首期账单 (含押金)
    db.bills.unshift({
      id:'BL_'+Date.now(), roomId:rm.id, building:rm.building, roomName:`${rm.building} - ${rm.name}`,
      tenant:rm.tenant, phone:rm.phone, month:start.slice(0,7), date:start,
      period:`${start} 至 ${start.slice(0,7)}-30`,
      rent:rm.rent, deposit:rm.deposit, waterFee:0, elecFee:0, extraFee:exSum,
      total:(rm.rent + rm.deposit + exSum).toFixed(0), paidAmount:0,
      detail:`首期租金¥${rm.rent}+押金¥${rm.deposit}`, status:'unmetered'
    });
    saveDB();
    const rIdx = db.rooms.findIndex(x => x.id === rm.id);
    // 显示原版同款“合同保存成功”引导页
    document.getElementById('modal-body').innerHTML = `
      <div style="padding:40px 20px;text-align:center;background:var(--card);">
        <div style="width:64px;height:64px;border-radius:50%;border:3px solid var(--primary);color:var(--primary);font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">✓</div>

        <div style="font-size:14px;color:#555;line-height:1.6;text-align:left;margin-bottom:24px;">
          系统将根据合同约定内容，定期自动生成账单。您可前往“工作台 -> 收租/账单”进行查看并处理。<br><br>
          首期账单现已生成，请点击下方“查看租客账单”按钮核对并收款。
        </div>
        <div style="display:flex;gap:12px;">
          <button class="btn" style="flex:1" onclick="openContractDetail(${rIdx})">查看合同</button>
          <button class="btn" style="flex:1" onclick="openModule('bills','ALL')">查看租客账单</button>
        </div>
      </div>`;
  }

      const idx = db.bills.findIndex(x => x.id === b.id);

  function openMeterForm(bIdx){

          <button class="btn" style="flex:1" onclick="saveMeterForm(${bIdx},false)">保存账单</button>

        ` : ''}

  function calcMeter(bIdx){
    const b = db.bills[bIdx], r = db.rooms.find(x => x.id === b.roomId) || { waterPrice:8, elecPrice:1, lastWater:0, lastElec:0 };
    const rent = Number(document.getElementById('am-rent')?.value||0);
    const dep = Number(document.getElementById('am-dep')?.value||0);
    const cw = Number(document.getElementById('am-w')?.value||0), ce = Number(document.getElementById('am-e')?.value||0);
    const uw = r.lastWater ? Math.max(0, cw - r.lastWater) : 0;
    const ue = r.lastElec ? Math.max(0, ce - r.lastElec) : 0;
    const wf = uw * (r.waterPrice||8), ef = ue * (r.elecPrice||1);
    document.getElementById('am-w-use').innerText = uw;
    document.getElementById('am-e-use').innerText = ue;
    document.getElementById('am-w-fee').innerText = wf + ' 元';
    document.getElementById('am-e-fee').innerText = ef + ' 元';
    document.getElementById('am-total').innerText = '¥' + (rent + dep + wf + ef + Number(b.extraFee||0));
  }

  function saveMeterForm(bIdx, andPay){
    const b = db.bills[bIdx], r = db.rooms.find(x => x.id === b.roomId);
    const rent = Number(document.getElementById('am-rent')?.value||0);
    const dep = Number(document.getElementById('am-dep')?.value||0);
    const cw = Number(document.getElementById('am-w')?.value||0), ce = Number(document.getElementById('am-e')?.value||0);
    const uw = (r && r.lastWater) ? Math.max(0, cw - r.lastWater) : 0;
    const ue = (r && r.lastElec) ? Math.max(0, ce - r.lastElec) : 0;
    const wf = uw * (r?.waterPrice||8), ef = ue * (r?.elecPrice||1);
    b.lastW = r?.lastWater || '-'; b.curW = cw; b.useW = uw; b.waterFee = wf;
    b.lastE = r?.lastElec || '-'; b.curE = ce; b.useE = ue; b.elecFee = ef;
    if(r){ if(cw) r.lastWater = cw; if(ce) r.lastElec = ce; }
    b.rent = rent; b.deposit = dep;
    b.total = (rent + dep + wf + ef + Number(b.extraFee||0)).toFixed(0);
    b.status = 'unpaid';

    if(andPay){
      if(confirm('如果已经收到租客的租金，请点“确定”，系统自动将该账单状态改为“已收租”。')){
        b.status = 'paid'; b.paidAmount = b.total;
        db.ledger.unshift({ type:'in', title:`[收租] ${b.roomName} (${b.tenant})`, amount:Number(b.total), date:new Date().toISOString().slice(0,10) });
      }
    } else {
      alert('保存成功！');
    }
    saveDB(); closeLv3(); renderBillsPage();
  }

  function openBulkMeter(){

        <div class="item-card">

          </div>

  function submitBulkMeter(){
    const rented = db.rooms.filter(r => r.status === 'rented'), curM = new Date().toISOString().slice(0,7), td = new Date().toISOString().slice(0,10);
    rented.forEach((rm, i) => {
      const cw = Number(document.getElementById(`bm-w-${i}`).value||rm.lastWater||0);
      const ce = Number(document.getElementById(`bm-e-${i}`).value||rm.lastElec||0);
      const uw = Math.max(0, cw - (rm.lastWater||0)), ue = Math.max(0, ce - (rm.lastElec||0));
      const wf = uw * (rm.waterPrice||8), ef = ue * (rm.elecPrice||1);
      rm.lastWater = cw; rm.lastElec = ce;
      db.bills.unshift({
        id:'BL_'+Date.now()+'_'+i, roomId:rm.id, building:rm.building, roomName:`${rm.building} - ${rm.name}`,
        tenant:rm.tenant, phone:rm.phone, month:curM, date:td, period:`${curM}-01 至 ${curM}-30`,
        rent:rm.rent, deposit:0, curW:cw, useW:uw, waterFee:wf, curE:ce, useE:ue, elecFee:ef,
        total:(rm.rent + wf + ef).toFixed(0), status:'unpaid'
      });
    });
    saveDB(); openModule('bills','ALL'); alert(`已批量生成 ${rented.length} 份账单！`);
  }

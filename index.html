<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>房东之友</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#111; --sub:#86909c; --primary:#3b6ef6; --danger:#f53f3f; --success:#00b42a; --warn:#ff7d00; --border:#f0f2f5; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    body { background:var(--bg); color:var(--text); padding-bottom:75px; user-select:none; }
    .navbar { position:sticky; top:0; z-index:100; background:var(--card); height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:17px; font-weight:700; border-bottom:1px solid var(--border); }
    .sync-badge { font-size:12px; font-weight:500; color:var(--success); background:#e8ffea; padding:4px 10px; border-radius:12px; cursor:pointer; }
    .container { padding:14px; }
    .section-title { font-size:16px; font-weight:700; margin:10px 4px 14px; color:#111; display:flex; justify-content:space-between; align-items:center; }
    
    /* 首页卡片 UI 复刻 */
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .stat-card { background:var(--card); border-radius:12px; padding:16px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.02); }
    .stat-label { font-size:14px; color:var(--sub); line-height:1.5; }
    .stat-num { font-size:24px; font-weight:700; color:#111; }
    .workbench-card { background:var(--card); border-radius:12px; padding:20px 10px 10px; display:grid; grid-template-columns:repeat(3,1fr); gap:20px 10px; box-shadow:0 2px 8px rgba(0,0,0,0.02); }
    .wb-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
    .wb-icon { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; margin-bottom:8px; }
    .wb-label { font-size:13px; color:#333; font-weight:500; }
    
    /* 通用列表与徽章 (精确对齐原版色彩) */
    .card-list { padding:10px 14px; }
    .item-card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 6px rgba(0,0,0,0.03); cursor:pointer; }
    .item-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:700; font-size:16px; }
    .badge { font-size:11px; padding:3px 8px; border-radius:4px; font-weight:500; }
    .badge.green { background:#e8ffea; color:var(--success); } /* 已租/已收清 */
    .badge.red { background:#ffece8; color:var(--danger); } /* 空房/欠租 */
    .badge.orange { background:#fff4e8; color:var(--warn); } /* 未抄表/待处理 */
    .badge.blue { background:#e8f3ff; color:var(--primary); } 
    .item-row { font-size:13px; color:var(--sub); margin:6px 0; display:flex; justify-content:space-between; align-items:center; }
    
    /* 四级 Tab 导航 */
    .room-tabs { display:flex; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:10; }
    .r-tab { flex:1; text-align:center; padding:12px 0; font-size:14px; color:var(--sub); cursor:pointer; position:relative; }
    .r-tab.active { color:var(--primary); font-weight:700; }
    .r-tab.active::after { content:''; position:absolute; bottom:0; left:35%; right:35%; height:3px; background:var(--primary); border-radius:2px; }
    
    /* 表单与按钮 */
    .cell-group { background:var(--card); border-radius:12px; margin:0 0 14px; padding:0 14px; }
    .cell-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .cell-row:last-child { border-bottom:none; }
    .cell-label { color:#111; min-width:90px; }
    .req { color:var(--danger); margin-left:2px; }
    .cell-input, .cell-select { flex:1; border:none; text-align:right; font-size:14px; color:#111; background:transparent; outline:none; }
    .btn { width:100%; padding:12px; border:none; border-radius:8px; background:var(--primary); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    .btn-outline { background:#f2f3f5; color:#111; }
    .btn-sm { padding:6px 12px; font-size:12px; border-radius:6px; border:none; cursor:pointer; background:#f2f3f5; color:#333; margin-left:6px; font-weight:500; }
    .btn-sm.primary { background:var(--primary); color:#fff; }
    
    /* 底部导航与模态框 */
    .tabbar { position:fixed; bottom:0; left:0; right:0; height:56px; background:var(--card); display:flex; border-top:1px solid var(--border); z-index:100; padding-bottom:env(safe-area-inset-bottom); }
    .tab-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--sub); font-size:11px; cursor:pointer; }
    .tab-item.active { color:var(--primary); font-weight:700; }
    .tab-icon { font-size:22px; margin-bottom:2px; }
    .modal { position:fixed; inset:0; background:var(--bg); z-index:200; overflow-y:auto; display:none; padding-bottom:80px; }
    .modal.show { display:block; }
    .modal-lv3 { z-index:250; }
    .modal-header { position:sticky; top:0; background:var(--card); height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid var(--border); font-weight:700; font-size:16px; z-index:20; }
    .back-btn { font-size:24px; cursor:pointer; color:#111; width:40px; }
    
    /* 底部动作面板 (替代弹窗) */
    .action-sheet { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:400; display:none; flex-direction:column; justify-content:flex-end; }
    .action-sheet.show { display:flex; }
    .action-panel { background:var(--card); border-radius:16px 16px 0 0; padding:20px; max-height:85vh; overflow-y:auto; animation:slideUp 0.3s ease; }
    @keyframes slideUp { from {transform:translateY(100%);} to {transform:translateY(0);} }
    .empty-tip { text-align:center; color:var(--sub); padding:50px 0; font-size:14px; }
  </style>
</head>
<body>

  <!-- 初始化/登录拦截 -->
  <div id="auth-screen" class="modal" style="background:var(--card); z-index:500; display:none; align-items:center; justify-content:center;">
    <div style="width:100%; max-width:320px; padding:20px;">
      <div style="text-align:center;font-size:24px;font-weight:700;margin-bottom:24px;color:var(--primary);">房东之友</div>
      <div id="auth-form"></div>
    </div>
  </div>

  <div class="navbar">
    <span style="font-size:13px;color:var(--sub);" id="role-tag">加载中...</span>
    <span id="app-title">房东之友</span>
    <span class="sync-badge" id="sync-status" onclick="syncFromCloud(true)">☁️ 已同步</span>
  </div>

  <!-- 1. 首页工作台 (精准对齐视频数据大盘) -->
  <div id="tab-workbench" class="container">
    <div class="stats-grid">
      <div class="stat-card" onclick="openModule('rooms')"><div class="stat-label">全部<br>房间数</div><div class="stat-num" id="st-total">0</div></div>
      <div class="stat-card" onclick="openModule('rooms', 'vacant')"><div class="stat-label">空房数<br>待招租</div><div class="stat-num" style="color:var(--danger)" id="st-vacant">0</div></div>
      <div class="stat-card" onclick="openModule('contracts')"><div class="stat-label">在租中<br>房间数</div><div class="stat-num" id="st-rented">0</div></div>
      <div class="stat-card" onclick="openModule('bills', 'unpaid')"><div class="stat-label">待处理<br>账单数</div><div class="stat-num" style="color:var(--primary)" id="st-due">0</div></div>
    </div>
    <div class="workbench-card">
      <div class="wb-item" onclick="openModule('rooms')"><div class="wb-icon" style="background:#5396ff">🏢</div><div class="wb-label">我的房源</div></div>
      <div class="wb-item" onclick="openModule('contracts')"><div class="wb-icon" style="background:#c55df6">📄</div><div class="wb-label">租客合同</div></div>
      <div class="wb-item" onclick="openModule('recruit')"><div class="wb-icon" style="background:#ff9d5c">码</div><div class="wb-label">招租二维码</div></div>
      <div class="wb-item" onclick="openModule('sign')"><div class="wb-icon" style="background:#ff7e47">✍️</div><div class="wb-label">租客签约</div></div>
      <div class="wb-item" onclick="openModule('bills')"><div class="wb-icon" style="background:#6467f0">¥</div><div class="wb-label">收租/账单</div></div>
      <div class="wb-item" onclick="openCheckoutHome()"><div class="wb-icon" style="background:#f25781">退</div><div class="wb-label">退租</div></div>
      <div class="wb-item" onclick="openModule('repairs')"><div class="wb-icon" style="background:#148e99">🛠️</div><div class="wb-label">报修</div></div>
      <div class="wb-item" onclick="openBulkMeter()"><div class="wb-icon" style="background:#20b2aa">⚡</div><div class="wb-label">集中抄表</div></div>
      <div class="wb-item" onclick="switchTab('stats',document.querySelectorAll('.tab-item')[1])"><div class="wb-icon" style="background:#00b42a">📊</div><div class="wb-label">收支统计</div></div>
    </div>
  </div>

  <!-- 2. 财务统计页 (超越原版的功能) -->
  <div id="tab-stats" class="container" style="display:none;"></div>
  
  <!-- 3. 消息通知 -->
  <div id="tab-msg" class="container" style="display:none;"><div class="section-title">消息与待办</div><div id="msg-list"></div></div>
  
  <!-- 4. 我的设置 -->
  <div id="tab-mine" class="container" style="display:none;">
    <div class="cell-group" style="margin-top:14px;"><div class="cell-row"><span class="cell-label" id="cur-user-title">当前登录</span><span id="cur-user-phone"></span></div><div class="cell-row" onclick="logoutPhone()"><span class="cell-label" style="color:var(--danger)">退出登录</span></div></div>
    <div class="section-title">房东组与协管员</div><div id="managers-list-box"></div>
  </div>

  <!-- 二级通用列表 Modal -->
  <div id="module-modal" class="modal">
    <div class="modal-header"><span class="back-btn" onclick="closeModule()">‹</span><span id="modal-title">列表</span><span style="width:40px;"></span></div>
    <div id="modal-body"></div>
  </div>

  <!-- 三级详情 Modal (带 Tab) -->
  <div id="lv3-modal" class="modal modal-lv3">
    <div class="modal-header"><span class="back-btn" onclick="closeLv3()">‹</span><span id="lv3-title">详情</span><span style="width:40px;"></span></div>
    <div id="lv3-tabs" class="room-tabs" style="display:none;">
      <div class="r-tab active" onclick="switchRoomTab('basic',this)">基本信息</div>
      <div class="r-tab" onclick="switchRoomTab('tenant',this)">租客信息</div>
      <div class="r-tab" onclick="switchRoomTab('contract',this)">合同信息</div>
      <div class="r-tab" onclick="switchRoomTab('bills',this)">账单信息</div>
    </div>
    <div id="lv3-body"></div>
  </div>

  <!-- 底部动作面板 (Action Sheet) -->
  <div id="action-sheet" class="action-sheet">
    <div class="action-panel">
      <div style="font-size:18px;font-weight:700;margin-bottom:16px;text-align:center;position:relative;"><span id="action-title-text">操作</span><span style="position:absolute;right:0;color:var(--sub);cursor:pointer;" onclick="closeAction()">×</span></div>
      <div id="action-body"></div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar" id="main-tabbar">
    <div class="tab-item active" onclick="switchTab('workbench',this)"><div class="tab-icon">❖</div>工作台</div>
    <div class="tab-item" onclick="switchTab('stats',this)"><div class="tab-icon">📈</div>统计</div>
    <div class="tab-item" onclick="switchTab('msg',this)"><div class="tab-icon">🔔</div>消息通知</div>
    <div class="tab-item" onclick="switchTab('mine',this)"><div class="tab-icon">👤</div>我的</div>
  </div>

<script>
  // 数据库直连配置
  const SP_URL = 'https://stsfiyzfyfwpbqjkrwbl.supabase.co';
  const SP_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0c2ZpeXpmeWZ3cGJxamtyd2JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTI5NzIsImV4cCI6MjEwOTEyODk3Mn0.TuPWBTPMmi9y06XQAGZsxaTq7vTijyuwRI3pktXBrAQ';
  const STORAGE_KEY = 'FDZY_DATA_V5', LOGIN_KEY = 'FDZY_PHONE_V5';

  let currentPhone = localStorage.getItem(LOGIN_KEY) || '';
  let activeRoomIdx = -1, listFilter = 'ALL';
  let tempExtraFees = [];

  let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || { adminPhone:'', managers:[], rooms:[], pastTenants:[], bills:[], repairs:[], expenses:[], ledger:[] };

  function isBoss(){ return !db.adminPhone || currentPhone === db.adminPhone; }
  function setSyncBadge(t, warn){ const el = document.getElementById('sync-status'); el.innerText=t; el.style.color=warn?'var(--warn)':'var(--success)'; el.style.background=warn?'#fff4e8':'#e8ffea'; }

  // 极速云同步
  async function syncFromCloud(manual){
    setSyncBadge('🔄 同步', true);
    try {
      const res = await fetch(`${SP_URL}/rest/v1/store?id=eq.1&select=data`, { headers: { 'apikey':SP_KEY, 'Authorization':`Bearer ${SP_KEY}` } });
      if(!res.ok) throw new Error();
      const rows = await res.json();
      if(rows.length > 0 && rows[0].data) db = Object.assign(db, rows[0].data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      setSyncBadge('☁️ 已同步', false); if(manual && db.adminPhone) alert('已同步云端最新数据');
      verifyAccess();
    } catch(e) { setSyncBadge('⚠️ 离线', true); verifyAccess(); }
  }

  async function saveDB(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); refreshDashboard();
    setSyncBadge('🔄 保存', true);
    try {
      const res = await fetch(`${SP_URL}/rest/v1/store`, { method:'POST', headers:{'apikey':SP_KEY,'Authorization':`Bearer ${SP_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'}, body:JSON.stringify({id:1, data:db}) });
      if(res.ok) setSyncBadge('☁️ 已同步', false); else throw new Error();
    } catch(e){ setSyncBadge('⚠️ 待同步', true); }
  }

  // 权限控制
  function verifyAccess(){
    const s = document.getElementById('auth-screen');
    if(!db.adminPhone){
      s.style.display = 'flex';
      document.getElementById('auth-form').innerHTML = `<input id="init-p" type="tel" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin-bottom:20px;font-size:16px;outline:none;" placeholder="设置主房东手机号"><button class="btn" onclick="initAdmin()">绑定并进入系统</button>`;
      return;
    }
    if(currentPhone === db.adminPhone || (db.managers||[]).some(m => m.phone === currentPhone)){
      s.style.display = 'none'; document.getElementById('role-tag').innerText = isBoss()?'👑 主房东':'👤 管家';
      refreshDashboard(); renderManagersSection();
    } else {
      s.style.display = 'flex';
      document.getElementById('auth-form').innerHTML = `<input id="login-p" type="tel" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin-bottom:20px;font-size:16px;outline:none;" placeholder="输入手机号登录"><button class="btn" onclick="doLogin()">极速免密登录</button>`;
    }
  }

  function initAdmin(){ const p = document.getElementById('init-p').value.trim(); if(p){ db.adminPhone=p; currentPhone=p; localStorage.setItem(LOGIN_KEY,p); saveDB(); verifyAccess(); } }
  function doLogin(){ const p = document.getElementById('login-p').value.trim(); if(p===db.adminPhone || (db.managers||[]).some(m=>m.phone===p)){ currentPhone=p; localStorage.setItem(LOGIN_KEY,p); verifyAccess(); } else alert('无权限！'); }
  function logoutPhone(){ currentPhone=''; localStorage.removeItem(LOGIN_KEY); verifyAccess(); }

  // 交互控制
  function closeModule(){ document.getElementById('module-modal').classList.remove('show'); refreshDashboard(); }
  function closeLv3(){ document.getElementById('lv3-modal').classList.remove('show'); document.getElementById('lv3-tabs').style.display='none'; }
  function closeAction(){ document.getElementById('action-sheet').classList.remove('show'); }

  // 首页数据大盘
  function refreshDashboard(){
    const total = db.rooms.length, vacant = db.rooms.filter(r=>r.status==='vacant').length, rented = total - vacant;
    document.getElementById('st-total').innerText = total; document.getElementById('st-vacant').innerText = vacant;
    document.getElementById('st-rented').innerText = rented; document.getElementById('st-due').innerText = db.bills.filter(b=>b.status!=='paid').length;
    renderStatsTab();
    
    let msgs = [];
    db.bills.filter(b=>b.status!=='paid').forEach(b => msgs.push(`<div class="item-card" onclick="openModule('bills')"><div class="item-header"><span>💰 待收租：${b.roomName}</span><span class="badge ${b.status==='unmetered'?'orange':'red'}">${b.status==='unmetered'?'未抄表':'待收款'}</span></div><div class="item-row"><span>应收总额：¥${b.total}</span><span>${b.month} 账单</span></div></div>`));
    db.repairs.filter(r=>r.status==='pending').forEach(r => msgs.push(`<div class="item-card"><div class="item-header"><span>🛠️ 报修：${r.roomName}</span><span class="badge orange">待处理</span></div><div class="item-row"><span>${r.desc}</span></div></div>`));
    document.getElementById('msg-list').innerHTML = msgs.length ? msgs.join('') : '<div class="empty-tip">暂无最新消息</div>';
  }

  // --- 核心模块路由 ---
  function openModule(type, filter='ALL'){
    document.getElementById('module-modal').classList.add('show');
    const title = document.getElementById('modal-title'), body = document.getElementById('modal-body');
    listFilter = filter;
    
    if(type === 'rooms'){
      title.innerText = '房源列表';
      body.innerHTML = `<div style="background:var(--card);padding:10px 14px;"><div style="display:flex;background:var(--bg);border-radius:8px;padding:8px 12px;"><span style="color:var(--sub);margin-right:8px;">🔍</span><input id="rm-kw" style="border:none;background:transparent;outline:none;width:100%;font-size:14px;" placeholder="搜索房号" oninput="renderRoomsList()"></div></div>
        <div style="display:flex;background:var(--card);border-bottom:1px solid var(--border);">
          <div class="r-tab ${filter==='ALL'?'active':''}" onclick="listFilter='ALL';renderRoomsList();this.parentElement.querySelectorAll('.r-tab').forEach(e=>e.classList.remove('active'));this.classList.add('active')">全部房间</div>
          <div class="r-tab ${filter==='vacant'?'active':''}" onclick="listFilter='vacant';renderRoomsList();this.parentElement.querySelectorAll('.r-tab').forEach(e=>e.classList.remove('active'));this.classList.add('active')">只看空房</div>
          <div class="r-tab ${filter==='rented'?'active':''}" onclick="listFilter='rented';renderRoomsList();this.parentElement.querySelectorAll('.r-tab').forEach(e=>e.classList.remove('active'));this.classList.add('active')">只看已租</div>
        </div>
        <div style="padding:12px;display:flex;gap:10px;"><button class="btn" style="flex:1" onclick="addSingleRoom()">添加房间</button><button class="btn btn-outline" style="flex:1" onclick="bulkCreateRooms()">批量建栋</button></div>
        <div id="rooms-list-box" class="card-list"></div>`;
      renderRoomsList();
    }
    else if(type === 'sign') renderSignPage(); else if(type === 'bills') renderBillsPage();
    else if(type === 'contracts') renderContractsPage(); else if(type === 'repairs') renderRepairsPage();
    else if(type === 'recruit'){
      title.innerText = '招租';
      body.innerHTML = `<div class="item-card" style="margin:16px;text-align:center;padding:30px 20px;"><div style="font-weight:700;font-size:16px;margin-bottom:20px;">专属空房招租二维码</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.href)}" style="width:200px;height:200px;border-radius:12px;"><div style="font-size:13px;color:var(--sub);margin-top:20px;">扫码查看我的空房和快到期房间</div></div>`;
    }
  }

  // --- 四维一体：房间台账 (1:1 复刻视频) ---
  function renderRoomsList(){
    const kw = (document.getElementById('rm-kw')?.value||'').toLowerCase();
    const list = db.rooms.filter(r => (listFilter==='ALL' || r.status===listFilter) && (!kw || r.name.includes(kw)));
    document.getElementById('rooms-list-box').innerHTML = list.map(r => {
      const idx = db.rooms.findIndex(x => x.id === r.id);
      return `<div class="item-card" onclick="openRoomTabs(${idx})"><div class="item-header"><span>${r.name}</span><span class="badge ${r.status==='vacant'?'red':'green'}">${r.status==='vacant'?'空房':'已租'}</span></div><div class="item-row" style="color:${r.status==='vacant'?'var(--danger)':'var(--text)'};"><span>${r.status==='vacant'?'未录入租金':r.tenant}</span><span>${r.building}</span></div></div>`;
    }).join('') || '<div class="empty-tip">暂无相关房间</div>';
  }

  function addSingleRoom(){
    const b = prompt('楼栋名 (如 5栋)：','5栋'), n = prompt('房间号 (如 101)：'); if(!n) return;
    db.rooms.push({ id:'RM_'+Date.now(), building:b, name:n, rent:1000, waterPrice:5, elecPrice:1, lastWater:0, lastElec:0, status:'vacant' });
    saveDB(); renderRoomsList();
  }
  function bulkCreateRooms(){
    const b = prompt('楼栋名称：','5栋'), f = Number(prompt('总楼层：','5')), p = Number(prompt('每层几间：','4'));

  }

      <div style="padding:16px;display:flex;gap:10px;"><button class="btn btn-outline" style="flex:1" onclick="saveRoomBasic()">修改房间信息</button>${r.status==='vacant'?`<button class="btn" style="flex:1" onclick="closeLv3();openModule('sign');">租客签约</button>`:`<button class="btn" style="flex:1;background:var(--danger)" onclick="openCheckoutForm('${r.id}')">退租</button>`}</div>`;
    } else if (tab === 'tenant'){
      box.innerHTML = r.status==='rented' ? `<div style="padding:16px;background:var(--card);margin-top:12px;display:flex;align-items:center;justify-content:space-between;"><div style="font-weight:700;font-size:16px;">${r.tenant}<div style="font-size:13px;color:var(--sub);font-weight:400;margin-top:4px;">${r.phone}</div><div style="font-size:13px;color:var(--sub);font-weight:400;margin-top:4px;">${r.startDate}起租</div></div><span class="badge green">在租中</span></div>` : `<div class="empty-tip">暂无租客信息</div>`;
    } else if (tab === 'contract'){
      box.innerHTML = r.status==='rented' ? `<div style="padding:16px;background:var(--card);margin-top:12px;"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><span style="color:var(--sub);font-size:14px;">合同编号: ${r.id.replace('RM_','')}</span><span class="badge green">生效中</span></div><div style="font-weight:700;font-size:15px;margin-bottom:6px;">${r.tenant} - ${r.phone}</div><div style="font-size:13px;color:var(--sub);line-height:1.6;">租金: ${r.rent}元/月, 押金: ${r.deposit||0}元<br>租期: ${r.startDate} 至 ${r.endDate}<br>签约日期: ${r.startDate}</div></div>` : `<div class="empty-tip">无合同信息</div>`;
    } else if (tab === 'bills'){
      const rBills = db.bills.filter(b=>b.roomId===r.id);
      box.innerHTML = rBills.length ? `<div style="padding:12px;display:flex;justify-content:space-between;background:var(--card);border-bottom:1px solid var(--border);"><span style="font-size:14px;color:var(--text);">全部账单</span></div><div class="card-list">`+rBills.map(b=>{
        return `<div class="item-card"><div class="item-header"><span>${b.tenant} - ${b.phone||''}</span><span style="color:var(--danger);font-weight:700;font-size:18px;">¥${b.total}</span></div><div class="item-row"><span>账期: ${b.month}</span><span class="badge ${b.status==='paid'?'green':(b.status==='unmetered'?'orange':'red')}">${b.status==='paid'?'已收租':(b.status==='unmetered'?'未抄表':'欠租')}</span></div></div>`;

  function saveRoomBasic(){ const r=db.rooms[activeRoomIdx]; r.rent=Number(document.getElementById('rt-rent').value); r.waterPrice=Number(document.getElementById('rt-wp').value); r.elecPrice=Number(document.getElementById('rt-ep').value); r.lastWater=Number(document.getElementById('rt-lw').value); r.lastElec=Number(document.getElementById('rt-le').value); saveDB(); alert('修改成功'); }

  // --- 签约与首期账单 (对齐视频逻辑) ---
  function renderSignPage(){
    const vacants = db.rooms.filter(r=>r.status==='vacant');
    if(!vacants.length){ document.getElementById('modal-body').innerHTML='<div class="empty-tip">无空房可租</div>'; return; }
    document.getElementById('modal-title').innerText = '租客签约';
    const td = new Date().toISOString().slice(0,10), nd = new Date(new Date().setFullYear(new Date().getFullYear()+1)).toISOString().slice(0,10);
    document.getElementById('modal-body').innerHTML = `
      <div class="section-title">录入租客信息</div>
      <div class="cell-group"><div class="cell-row"><span class="cell-label">租客姓名<span class="req">*</span></span><input id="s-name" class="cell-input" placeholder="请填写"></div><div class="cell-row"><span class="cell-label">手机号<span class="req">*</span></span><input id="s-phone" type="tel" class="cell-input" placeholder="请填写"></div><div class="cell-row"><span class="cell-label">身份证号</span><input id="s-id" class="cell-input" placeholder="请填写"></div></div>
      <div class="section-title">录入合同信息</div>
      <div class="cell-group"><div class="cell-row"><span class="cell-label">所租房间<span class="req">*</span></span><select id="s-rm" class="cell-select" onchange="syncSignUI()">${vacants.map(r=>`<option value="${r.id}">${r.building}-${r.name}</option>`).join('')}</select></div><div class="cell-row"><span class="cell-label">起租日期<span class="req">*</span></span><input id="s-start" type="date" class="cell-input" value="${td}"></div><div class="cell-row"><span class="cell-label">结束日期<span class="req">*</span></span><input id="s-end" type="date" class="cell-input" value="${nd}"></div><div class="cell-row"><span class="cell-label">收租周期<span class="req">*</span></span><span class="cell-input">月付 (每月一次)</span></div></div>
      <div class="section-title">费用项目</div>
      <div class="cell-group"><div class="cell-row"><span class="cell-label">租金<span class="req">*</span></span><div style="display:flex;align-items:center;"><input id="s-rent" type="number" class="cell-input" value="${vacants[0].rent}"><span style="margin-left:4px;color:var(--text);">元/月</span></div></div><div class="cell-row"><span class="cell-label">押金<span class="req">*</span></span><div style="display:flex;align-items:center;"><input id="s-dep" type="number" class="cell-input" value="${vacants[0].rent}"><span style="margin-left:4px;color:var(--text);">元</span></div></div><div class="cell-row"><span class="cell-label">水底数<span class="req">*</span></span><input id="s-w" type="number" class="cell-input" value="${vacants[0].lastWater||0}"></div><div class="cell-row"><span class="cell-label">电底数<span class="req">*</span></span><input id="s-e" type="number" class="cell-input" value="${vacants[0].lastElec||0}"></div></div>
      <div style="padding:16px;"><button class="btn" onclick="submitSign()">保存合同 (自动生成首期账单)</button></div>`;
  }
  function syncSignUI(){ const rm=db.rooms.find(r=>r.id===document.getElementById('s-rm').value); if(rm){ document.getElementById('s-rent').value=rm.rent; document.getElementById('s-dep').value=rm.rent; document.getElementById('s-w').value=rm.lastWater||0; document.getElementById('s-e').value=rm.lastElec||0; } }
  
  function submitSign(){
    const nm = document.getElementById('s-name').value.trim(), ph = document.getElementById('s-phone').value.trim(); if(!nm||!ph) return alert('姓名手机必填！');
    const rm = db.rooms.find(r=>r.id===document.getElementById('s-rm').value);
    rm.status='rented'; rm.tenant=nm; rm.phone=ph; rm.idCard=document.getElementById('s-id').value; rm.startDate=document.getElementById('s-start').value; rm.endDate=document.getElementById('s-end').value;
    rm.rent=Number(document.getElementById('s-rent').value); rm.deposit=Number(document.getElementById('s-dep').value); rm.lastWater=Number(document.getElementById('s-w').value); rm.lastElec=Number(document.getElementById('s-e').value);
    
    // 签约即生成首期账单 (租金+押金)
    db.bills.unshift({ id:'BL_'+Date.now(), roomId:rm.id, building:rm.building, roomName:`${rm.building}-${rm.name}`, tenant:rm.tenant, phone:rm.phone, month:rm.startDate.slice(0,7), total:(rm.rent+rm.deposit).toFixed(2), paidAmount:0, detail:`首月租金¥${rm.rent} + 押金¥${rm.deposit}`, status:'unpaid' });
    saveDB(); closeModule(); alert('合同保存成功！首期账单已生成，请前往【收租/账单】查收。');
  }

  // --- 智能抄表与收银 (Action Sheet 滑出体验) ---
  function openMeterForm(bIdx){
    const b = db.bills[bIdx], r = db.rooms.find(x=>x.id===b.roomId);
    document.getElementById('action-sheet').classList.add('show'); document.getElementById('action-title-text').innerText = `编辑账单：${b.roomName}`;
    document.getElementById('action-body').innerHTML = `
      <div class="cell-group" style="margin:0;"><div class="cell-row"><span class="cell-label" style="font-weight:700;">租金</span><span style="font-weight:700;">¥${r.rent}</span></div></div>
      <div class="section-title" style="padding-left:4px;font-size:14px;">水 (单价: ¥${r.waterPrice||5})</div>
      <div class="cell-group" style="margin:0;"><div class="cell-row"><span class="cell-label">上期表底</span><span>${r.lastWater||0}</span></div><div class="cell-row"><span class="cell-label">本期表底</span><input id="am-w" type="number" class="cell-input" style="font-size:18px;font-weight:700;color:var(--primary);" placeholder="请抄表" oninput="calcMeter(${bIdx})"></div><div class="cell-row"><span class="cell-label">用量</span><span id="am-w-use">0</span></div></div>
      <div class="section-title" style="padding-left:4px;font-size:14px;">电 (单价: ¥${r.elecPrice||1})</div>
      <div class="cell-group" style="margin:0 0 16px;"><div class="cell-row"><span class="cell-label">上期表底</span><span>${r.lastElec||0}</span></div><div class="cell-row"><span class="cell-label">本期表底</span><input id="am-e" type="number" class="cell-input" style="font-size:18px;font-weight:700;color:var(--primary);" placeholder="请抄表" oninput="calcMeter(${bIdx})"></div><div class="cell-row"><span class="cell-label">用量</span><span id="am-e-use">0</span></div></div>
      <div style="font-size:16px;font-weight:700;text-align:right;margin-bottom:16px;">合计金额: <span id="am-total" style="color:var(--danger);font-size:22px;">¥${b.total}</span></div>
      <button class="btn" onclick="saveMeterForm(${bIdx})">保存账单</button>`;
  }
  function calcMeter(bIdx){
    const b = db.bills[bIdx], r = db.rooms.find(x=>x.id===b.roomId);
    const cw = Number(document.getElementById('am-w').value||r.lastWater||0), ce = Number(document.getElementById('am-e').value||r.lastElec||0);
    const uw = Math.max(0, cw-(r.lastWater||0)), ue = Math.max(0, ce-(r.lastElec||0));
    document.getElementById('am-w-use').innerText = uw; document.getElementById('am-e-use').innerText = ue;
    document.getElementById('am-total').innerText = `¥${(r.rent + uw*(r.waterPrice||5) + ue*(r.elecPrice||1)).toFixed(2)}`;
  }
  function saveMeterForm(bIdx){
    const b = db.bills[bIdx], r = db.rooms.find(x=>x.id===b.roomId);
    const cw = Number(document.getElementById('am-w').value), ce = Number(document.getElementById('am-e').value);
    if(!cw || !ce) return alert('需录入完整读数');
    const uw = Math.max(0, cw-(r.lastWater||0)), ue = Math.max(0, ce-(r.lastElec||0));
    const wf = uw*(r.waterPrice||5), ef = ue*(r.elecPrice||1);
    r.lastWater = cw; r.lastElec = ce; b.total = (r.rent+wf+ef).toFixed(2);
    b.detail = `租金¥${r.rent} + 水¥${wf} + 电¥${ef}`; b.status = 'unpaid';
    saveDB(); closeAction(); renderBillsList();
  }

  function openPayForm(bIdx){
    const b = db.bills[bIdx], rem = (Number(b.total)-Number(b.paidAmount||0)).toFixed(2);
    document.getElementById('action-sheet').classList.add('show'); document.getElementById('action-title-text').innerText = `账单收据：${b.roomName}`;
    document.getElementById('action-body').innerHTML = `<div class="cell-group" style="margin:0 0 16px;"><div class="cell-row"><span class="cell-label">账单总额</span><span style="font-weight:700;">¥${b.total}</span></div><div class="cell-row"><span class="cell-label">待收金额</span><span style="font-weight:700;color:var(--danger);font-size:20px;">¥${rem}</span></div><div class="cell-row"><span class="cell-label">实收金额</span><input id="pay-a" type="number" class="cell-input" style="font-size:20px;color:var(--success);font-weight:700;" value="${rem}"></div></div><button class="btn" style="background:var(--success);" onclick="confirmPay(${bIdx})">确认收款</button>`;
  }
  function confirmPay(bIdx){
    const b = db.bills[bIdx], amt = Number(document.getElementById('pay-a').value||0);
    b.paidAmount = (Number(b.paidAmount||0) + amt).toFixed(2);
    if(Number(b.paidAmount) >= Number(b.total) - 0.1) b.status = 'paid';
    if(amt>0) db.ledger.unshift({ type:'in', title:`[收租] ${b.roomName}`, amount:amt, date:new Date().toISOString().slice(0,10) });
    saveDB(); closeAction(); renderBillsList();
  }

  // --- 账单列表展示 (对齐视频状态机) ---
  function renderBillsPage(){
    document.getElementById('module-modal').classList.add('show'); document.getElementById('modal-title').innerText = '收租/账单';
    document.getElementById('modal-body').innerHTML = `<div style="background:var(--card);padding:10px 14px;"><div style="display:flex;background:var(--bg);border-radius:8px;padding:8px 12px;"><span style="color:var(--sub);margin-right:8px;">🔍</span><input id="b-kw" style="border:none;background:transparent;outline:none;width:100%;font-size:14px;" placeholder="搜索租客姓名/房号" oninput="renderBillsList()"></div></div><div style="display:flex;background:var(--card);border-bottom:1px solid var(--border);"><div class="r-tab active" onclick="listFilter='ALL';renderBillsList();this.parentElement.querySelectorAll('.r-tab').forEach(e=>e.classList.remove('active'));this.classList.add('active')">全部状态</div><div class="r-tab" onclick="listFilter='unmetered';renderBillsList();this.parentElement.querySelectorAll('.r-tab').forEach(e=>e.classList.remove('active'));this.classList.add('active')">未抄表</div><div class="r-tab" onclick="listFilter='unpaid';renderBillsList();this.parentElement.querySelectorAll('.r-tab').forEach(e=>e.classList.remove('active'));this.classList.add('active')">欠租</div></div><div id="bills-list-box" class="card-list"></div>`;
    listFilter = 'ALL'; renderBillsList();
  }
  function renderBillsList(){
    const kw = (document.getElementById('b-kw')?.value||'').toLowerCase();
    document.getElementById('bills-list-box').innerHTML = db.bills.filter(b=>(listFilter==='ALL'||(listFilter==='unpaid'?b.status!=='paid'&&b.status!=='unmetered':b.status===listFilter))&&(!kw||b.roomName.includes(kw)||b.tenant.includes(kw))).map(b => {
      const idx = db.bills.findIndex(x=>x.id===b.id), rem = (Number(b.total)-Number(b.paidAmount||0)).toFixed(2);
      return `<div class="item-card"><div class="item-header"><span>${b.roomName}</span><span style="color:var(--danger);font-weight:700;font-size:18px;">¥${b.total}</span></div><div class="item-row"><span style="color:var(--text);">${b.tenant}</span><span class="badge ${b.status==='paid'?'green':(b.status==='unmetered'?'orange':'red')}">${b.status==='paid'?'已收清':(b.status==='unmetered'?'未抄表':'欠租')}</span></div><div class="item-row"><span>账期: ${b.month}</span></div><div style="text-align:right;margin-top:12px;">${b.status==='unmetered'?`<button class="btn-sm primary" onclick="openMeterForm(${idx})">去抄表</button>`:''}${b.status!=='paid'?`<button class="btn-sm" style="background:var(--success);color:#fff;" onclick="openPayForm(${idx})">收银</button>`:''}</div></div>`;
    }).join('') || '<div class="empty-tip">暂无账单数据</div>';
  }

  // --- 全楼批量抄表 (超越原版) ---
  function openBulkMeter(){
    const rented = db.rooms.filter(r=>r.status==='rented'); if(!rented.length) return alert('无在租房间！');
    document.getElementById('module-modal').classList.add('show'); document.getElementById('modal-title').innerText = '集中抄表';
    document.getElementById('modal-body').innerHTML = `<div style="padding:14px;font-size:13px;color:var(--sub);background:#fff9ed;">输入最新读数，系统自动减去上月底数并批量出账单。</div><div class="card-list">${rented.map((r,i)=>`<div class="item-card"><div class="item-header"><span>${r.building}-${r.name} (${r.tenant})</span></div><div style="display:flex;gap:12px;margin-top:10px;"><div style="flex:1;"><div style="font-size:12px;color:var(--sub);">水 (底数:${r.lastWater||0})</div><input id="bm-w-${i}" type="number" style="width:100%;margin-top:6px;border:1px solid #e5e5e5;padding:8px;border-radius:6px;outline:none;" placeholder="新读数"></div><div style="flex:1;"><div style="font-size:12px;color:var(--sub);">电 (底数:${r.lastElec||0})</div><input id="bm-e-${i}" type="number" style="width:100%;margin-top:6px;border:1px solid #e5e5e5;padding:8px;border-radius:6px;outline:none;" placeholder="新读数"></div></div></div>`).join('')}<button class="btn" style="margin-top:10px;" onclick="submitBulkMeter()">一键生成本月全楼账单</button></div>`;
  }
  function submitBulkMeter(){
    const rented = db.rooms.filter(r=>r.status==='rented'), curM = new Date().toISOString().slice(0,7);
    rented.forEach((rm, i) => {
      const cw = Number(document.getElementById(`bm-w-${i}`).value||rm.lastWater||0), ce = Number(document.getElementById(`bm-e-${i}`).value||rm.lastElec||0);
      const uw = Math.max(0,cw-(rm.lastWater||0)), ue = Math.max(0,ce-(rm.lastElec||0));
      const wf = uw*(rm.waterPrice||5), ef = ue*(rm.elecPrice||1);
      rm.lastWater = cw; rm.lastElec = ce;
      db.bills.unshift({ id:'BL_'+Date.now()+'_'+i, roomId:rm.id, building:rm.building, roomName:`${rm.building}-${rm.name}`, tenant:rm.tenant, month:curM, total:(rm.rent+wf+ef).toFixed(2), paidAmount:0, detail:`租金¥${rm.rent}+水¥${wf}+电¥${ef}`, status:'unpaid' });
    });
    saveDB(); closeModule(); alert('批量出单完毕！');
  }

  // --- 退租核算 (对齐原版UI对冲逻辑) ---
  function openCheckoutHome(){
    document.getElementById('module-modal').classList.add('show'); document.getElementById('modal-title').innerText = '退租';
    document.getElementById('modal-body').innerHTML = `<div class="card-list">${db.rooms.filter(r=>r.status==='rented').map(r=>`<div class="item-card"><div class="item-header"><span>${r.building}-${r.name} (${r.tenant})</span><span class="badge blue">押金 ¥${r.deposit||0}</span></div><div style="text-align:right;margin-top:12px;"><button class="btn-sm primary" onclick="openCheckoutForm('${r.id}')">退租结算</button></div></div>`).join('')||'<div class="empty-tip">当前无在租房间</div>'}</div>`;
  }
  function openCheckoutForm(rId){
    const r = db.rooms.find(x=>x.id===rId);
    document.getElementById('action-sheet').classList.add('show'); document.getElementById('action-title-text').innerText = `退租结算：${r.roomName||r.name}`;
    document.getElementById('action-body').innerHTML = `<div class="cell-group" style="margin:0 0 12px;"><div class="cell-row"><span class="cell-label">应退金额 (押金)</span><span style="font-weight:700;color:var(--primary);">¥${r.deposit||0}</span></div></div><div class="cell-group" style="margin:0 0 16px;"><div class="cell-row"><span class="cell-label">应收扣款 (水电等)</span><input id="co-deduct" type="number" class="cell-input" style="font-weight:700;color:var(--danger);" placeholder="输入金额" oninput="calcCheckout(${r.deposit||0})"></div><div class="cell-row" style="background:#fafafa;"><span class="cell-label" style="font-weight:700;">总计实退</span><span id="co-net" style="font-weight:700;font-size:22px;color:var(--text);">¥${r.deposit||0}</span></div></div><button class="btn" style="background:var(--primary);" onclick="confirmCheckout('${rId}')">确认退租</button>`;
  }
  function calcCheckout(dep){ const d=Number(document.getElementById('co-deduct').value||0); document.getElementById('co-net').innerText = `¥${(dep-d).toFixed(2)}`; }
  function confirmCheckout(rId){
    const r = db.rooms.find(x=>x.id===rId), d = Number(document.getElementById('co-deduct').value||0), net = (Number(r.deposit||0)-d).toFixed(2);
    db.pastTenants.unshift({ building:r.building, name:r.name, tenant:r.tenant, checkoutDate:new Date().toISOString().slice(0,10), settleNote:`退还净额: ¥${net}` });
    r.status = 'vacant'; delete r.tenant; delete r.phone; saveDB(); closeAction(); openCheckoutHome(); alert('已完成退租核算！');
  }

  // --- 报修 ---
  function renderRepairsPage(){
    document.getElementById('modal-title').innerText = '报修处理';
    document.getElementById('modal-body').innerHTML = `<div style="padding:10px 14px;"><button class="btn" onclick="addRepairItem()">登记报修</button></div><div class="card-list">${db.repairs.map((r,i) => `<div class="item-card"><div class="item-header"><span>[${r.type||'水电'}] ${r.roomName}</span><span class="badge ${r.status==='done'?'green':'orange'}">${r.status==='done'?'已处理':'待处理'}</span></div><div class="item-row"><span>${r.desc}</span><span>${r.date}</span></div>${r.status==='pending'?`<div style="text-align:right;margin-top:10px;"><button class="btn-sm primary" onclick="db.repairs[${i}].status='done';saveDB();renderRepairsPage()">标记完成</button></div>`:''}</div>`).join('') || '<div class="empty-tip">无报修工单</div>'}</div>`;
  }
  function addRepairItem(){ const rm = prompt('报修房号：'); const desc = prompt('说明：'); if(rm&&desc){ db.repairs.unshift({ roomName:rm, type:'维修', desc, status:'pending', date:new Date().toISOString().slice(0,10) }); saveDB(); renderRepairsPage(); } }

  // --- 财务统计 (超越原版空白页) ---
  function renderStatsTab(){
    const box=document.getElementById('tab-stats'); if(!isBoss()){ box.innerHTML='<div class="empty-tip">🔒 仅主房东可看财务</div>'; return; }
    const inC = (db.ledger||[]).filter(l=>l.type==='in').reduce((s,l)=>s+Number(l.amount),0), exC = (db.expenses||[]).reduce((s,e)=>s+Number(e.amount),0);
    box.innerHTML = `<div class="item-card" style="background:var(--primary);color:#fff;"><div style="font-size:14px;opacity:0.9;">经营净利润 (收租 - 支出)</div><div style="font-size:32px;font-weight:700;margin:10px 0;">¥${(inC-exC).toFixed(2)}</div><div style="display:flex;justify-content:space-between;font-size:12px;opacity:0.9;"><span>总收: ¥${inC.toFixed(2)}</span><span>总支: ¥${exC.toFixed(2)}</span></div></div><button class="btn btn-outline" style="margin-bottom:16px;" onclick="addExpensePrompt()">记一笔日常支出</button><div class="section-title">流水明细</div><div class="cell-group">${(db.ledger||[]).slice(0,30).map(l=>`<div class="cell-row"><div><div style="font-weight:700;font-size:15px;color:var(--text);">${l.title}</div><div style="font-size:12px;color:var(--sub);margin-top:4px;">${l.date}</div></div><div style="font-weight:700;font-size:18px;color:${l.type==='in'?'var(--success)':'var(--danger)'}">${l.type==='in'?'+':'-'}¥${Number(l.amount).toFixed(2)}</div></div>`).join('')||'<div class="empty-tip">无流水</div>'}</div>`;
  }
  function addExpensePrompt(){ const cat=prompt('支出项(如维修):'); if(cat){ const amt=Number(prompt('金额:')); if(amt){ db.expenses.unshift({cat,amount:amt}); db.ledger.unshift({type:'out',title:`[支出] ${cat}`,amount:amt,date:new Date().toISOString().slice(0,10)}); saveDB(); } } }

  // --- 导航与杂项 ---
  function renderManagersSection(){ document.getElementById('managers-list-box').innerHTML = `<div class="cell-group" style="margin:0;"><div class="cell-row"><span>主号 (${db.adminPhone||'本机'})</span><span class="badge blue">管理员</span></div>${(db.managers||[]).map((m,i)=>`<div class="cell-row"><span>${m.name} (${m.phone})</span>${isBoss()?`<span class="badge red" onclick="db.managers.splice(${i},1);saveDB();renderManagersSection()">移除</span>`:'<span class="badge">管家</span>'}</div>`).join('')}</div>${isBoss()?`<div style="display:flex;gap:10px;margin-top:14px;"><input id="m-n" class="search-input" style="background:#fff;border:1px solid var(--border);flex:1" placeholder="称呼"><input id="m-p" type="tel" class="search-input" style="background:#fff;border:1px solid var(--border);flex:1.5" placeholder="手机号"><button class="btn" style="width:auto;padding:10px 16px;" onclick="addManager()">添加</button></div>`:''}`; }
  function addManager(){ const n=document.getElementById('m-n').value, p=document.getElementById('m-p').value; if(p){ db.managers.push({name:n||'管家',phone:p}); saveDB(); renderManagersSection(); alert('添加成功'); } }
  function switchTab(tab, el){ ['workbench','stats','msg','mine'].forEach(t => document.getElementById('tab-'+t).style.display = (t===tab)?'block':'none'); document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active')); if(el) el.classList.add('active'); if(tab==='mine') renderManagersSection(); if(tab==='stats') renderStatsTab(); }
  
  syncFromCloud(false);
</script>
</body>
</html>

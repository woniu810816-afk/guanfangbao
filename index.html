<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="房东之友">
  <title>房东之友 - 智能房管</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --text:#111; --sub:#666; --primary:#3b6ef6; --danger:#f53f3f; --success:#00b42a; --warn:#ff7d00; --border:#f0f0f0; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; background:var(--bg); color:var(--text); padding-bottom:75px; user-select:none; }
    .navbar { position:sticky; top:0; z-index:100; background:var(--card); height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:17px; font-weight:600; border-bottom:1px solid var(--border); }
    .sync-badge { font-size:12px; font-weight:500; color:var(--success); background:#e8ffea; padding:4px 10px; border-radius:12px; cursor:pointer; }
    .container { padding:12px; }
    .section-title { font-size:16px; font-weight:700; margin:10px 4px; color:#111; }
    
    /* 九宫格与工作台 */
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .stat-card { background:var(--card); border-radius:12px; padding:16px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.02); cursor:pointer; }
    .stat-label { font-size:14px; color:var(--sub); line-height:1.5; }
    .stat-num { font-size:24px; font-weight:700; }
    .workbench-card { background:var(--card); border-radius:12px; padding:20px 10px 10px; display:grid; grid-template-columns:repeat(3,1fr); gap:20px 10px; box-shadow:0 2px 8px rgba(0,0,0,0.02); }
    .wb-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
    .wb-icon { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; margin-bottom:8px; }
    .wb-label { font-size:13px; color:#333; }
    
    /* 底部导航 */
    .tabbar { position:fixed; bottom:0; left:0; right:0; height:56px; background:#fff; display:flex; border-top:1px solid var(--border); z-index:100; padding-bottom:env(safe-area-inset-bottom); }
    .tab-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#86909c; font-size:11px; cursor:pointer; }
    .tab-item.active { color:var(--primary); font-weight:600; }
    .tab-icon { font-size:20px; margin-bottom:2px; }
    
    /* 列表卡片 */
    .card-list { padding:10px 12px; }
    .item-card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.03); }
    .item-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:700; font-size:16px; }
    .badge { font-size:11px; padding:3px 8px; border-radius:4px; font-weight:500; }
    .badge.green { background:#e8ffea; color:var(--success); }
    .badge.red { background:#ffece8; color:var(--danger); }
    .badge.blue { background:#e8f3ff; color:var(--primary); }
    .badge.orange { background:#fff4e8; color:var(--warn); }
    .item-row { font-size:13px; color:var(--sub); margin:6px 0; display:flex; justify-content:space-between; align-items:center; }
    
    /* 按钮与表单 */
    .btn { width:100%; padding:12px; border:none; border-radius:8px; background:var(--primary); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    .btn-outline { background:#f2f3f5; color:#111; }
    .btn-sm { padding:6px 12px; font-size:12px; border-radius:6px; border:none; cursor:pointer; background:#f2f3f5; color:#333; margin-left:6px; font-weight:500; }
    .btn-sm.primary { background:var(--primary); color:#fff; }
    .btn-sm.danger { background:var(--danger); color:#fff; }
    .cell-group { background:#fff; border-radius:12px; margin:0 12px 12px; padding:0 14px; box-shadow:0 2px 6px rgba(0,0,0,0.02); }
    .cell-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .cell-row:last-child { border-bottom:none; }
    .cell-label { color:#111; min-width:90px; }
    .cell-input, .cell-select { flex:1; border:none; text-align:right; font-size:14px; color:#111; background:transparent; outline:none; }
    .search-bar { background:#fff; padding:10px 16px; display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--border); }
    .search-input { flex:1; background:var(--bg); border:none; border-radius:8px; padding:10px 14px; font-size:14px; outline:none; }
    
    /* 房间四级详情页 Tab */
    .room-tabs { display:flex; background:#fff; border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:10; }
    .r-tab { flex:1; text-align:center; padding:12px 0; font-size:14px; color:var(--sub); font-weight:500; cursor:pointer; position:relative; }
    .r-tab.active { color:var(--primary); font-weight:700; }
    .r-tab.active::after { content:''; position:absolute; bottom:0; left:30%; right:30%; height:3px; background:var(--primary); border-radius:2px; }
    
    /* 模态框与弹窗 */
    .modal { position:fixed; inset:0; background:var(--bg); z-index:200; overflow-y:auto; display:none; padding-bottom:80px; }
    .modal.show { display:block; }
    .modal-lv3 { z-index:250; }
    .modal-header { position:sticky; top:0; background:#fff; height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid var(--border); font-weight:600; font-size:16px; z-index:20; }
    .back-btn { font-size:24px; cursor:pointer; color:#111; width:40px; }
    
    /* 底部动作面板 (代替prompt) */
    .action-sheet { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:400; display:none; flex-direction:column; justify-content:flex-end; }
    .action-sheet.show { display:flex; }
    .action-panel { background:#fff; border-radius:16px 16px 0 0; padding:20px; max-height:85vh; overflow-y:auto; animation:slideUp 0.3s ease; }
    @keyframes slideUp { from {transform:translateY(100%);} to {transform:translateY(0);} }
    .action-title { font-size:18px; font-weight:700; margin-bottom:16px; text-align:center; position:relative; }
    .action-close { position:absolute; right:0; top:0; font-size:20px; color:#999; cursor:pointer; }
    
    .empty-tip { text-align:center; color:#999; padding:50px 0; font-size:14px; }
  </style>
</head>
<body>

  <div class="navbar">
    <span style="font-size:13px;color:var(--primary);" id="role-tag">加载中...</span>
    <span id="app-title">房东之友</span>
    <span class="sync-badge" id="sync-status" onclick="syncFromCloud(true)">☁️ 同步</span>
  </div>

  <!-- 首页工作台 -->
  <div id="tab-workbench" class="container">
    <div class="stats-grid">
      <div class="stat-card" onclick="openModule('rooms')"><div class="stat-label">全部<br>房间数</div><div class="stat-num" id="st-total">0</div></div>
      <div class="stat-card" onclick="openModule('rooms', 'vacant')"><div class="stat-label">空房数<br>待租</div><div class="stat-num" style="color:var(--danger)" id="st-vacant">0</div></div>
      <div class="stat-card" onclick="openModule('contracts')"><div class="stat-label">在租<br>租客数</div><div class="stat-num" id="st-rented">0</div></div>
      <div class="stat-card" onclick="openModule('bills')"><div class="stat-label">待处理<br>账单数</div><div class="stat-num" style="color:var(--primary)" id="st-due">0</div></div>
    </div>
    <div class="workbench-card">
      <div class="wb-item" onclick="openModule('rooms')"><div class="wb-icon" style="background:#5396ff">🏢</div><div class="wb-label">我的房源</div></div>
      <div class="wb-item" onclick="openModule('contracts')"><div class="wb-icon" style="background:#c55df6">📄</div><div class="wb-label">租客合同</div></div>
      <div class="wb-item" onclick="openModule('recruit')"><div class="wb-icon" style="background:#ff9d5c">码</div><div class="wb-label">招租二维码</div></div>
      <div class="wb-item" onclick="openModule('sign')"><div class="wb-icon" style="background:#ff7e47">✍️</div><div class="wb-label">租客签约</div></div>
      <div class="wb-item" onclick="openModule('bills')"><div class="wb-icon" style="background:#6467f0">¥</div><div class="wb-label">收租/账单</div></div>
      <div class="wb-item" onclick="openCheckoutHome()"><div class="wb-icon" style="background:#f25781">退</div><div class="wb-label">退租结算</div></div>
      <div class="wb-item" onclick="openModule('repairs')"><div class="wb-icon" style="background:#148e99">🛠️</div><div class="wb-label">报修维护</div></div>
      <div class="wb-item" onclick="openBulkMeter()"><div class="wb-icon" style="background:#20b2aa">⚡</div><div class="wb-label">集中抄表</div></div>
      <div class="wb-item" onclick="switchTab('stats',document.querySelectorAll('.tab-item')[1])"><div class="wb-icon" style="background:#00b42a">📊</div><div class="wb-label">财务统计</div></div>
    </div>
  </div>

  <div id="tab-stats" class="container" style="display:none;"></div>
  <div id="tab-msg" class="container" style="display:none;"><div class="section-title">消息与待办</div><div id="msg-list"></div></div>
  <div id="tab-mine" class="container" style="display:none;">
    <div class="item-card"><div class="item-header"><span id="cur-user-title">当前登录</span><span class="badge blue" onclick="logoutPhone()">退出登录</span></div><div class="item-row" id="cur-user-phone"></div></div>
    <div class="section-title">协管员与权限控制</div><div id="managers-list-box"></div>
  </div>

  <!-- 二级页面 (房源列表/账单列表等) -->
  <div id="module-modal" class="modal">
    <div class="modal-header"><span class="back-btn" onclick="closeModule()">‹</span><span id="modal-title">列表</span><span style="width:40px;"></span></div>
    <div id="modal-body"></div>
  </div>

  <!-- 三级/四级页面 (四Tab房间详情页/大表单) -->
  <div id="lv3-modal" class="modal modal-lv3">
    <div class="modal-header"><span class="back-btn" onclick="closeLv3()">‹</span><span id="lv3-title">详情</span><span style="width:40px;"></span></div>
    <div id="lv3-tabs" class="room-tabs" style="display:none;">
      <div class="r-tab active" onclick="switchRoomTab('basic',this)">基本信息</div>
      <div class="r-tab" onclick="switchRoomTab('tenant',this)">租客信息</div>
      <div class="r-tab" onclick="switchRoomTab('contract',this)">合同信息</div>
      <div class="r-tab" onclick="switchRoomTab('bills',this)">账单信息</div>
    </div>
    <div id="lv3-body"></div>
  </div>

  <!-- 底部动作面板 (完美替代Prompt弹窗，用于抄表、收租、退租) -->
  <div id="action-sheet" class="action-sheet">
    <div class="action-panel">
      <div class="action-title"><span id="action-title-text">操作</span><span class="action-close" onclick="closeAction()">×</span></div>
      <div id="action-body"></div>
    </div>
  </div>

  <!-- 首次登录强制全屏覆盖 -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">房</div><div style="text-align:center;font-size:20px;font-weight:700;margin-bottom:20px;">房东之友</div>
      <div id="auth-form"></div>
    </div>
  </div>

  <div class="tabbar" id="main-tabbar">
    <div class="tab-item active" onclick="switchTab('workbench',this)"><div class="tab-icon">❖</div>工作台</div>
    <div class="tab-item" onclick="switchTab('stats',this)"><div class="tab-icon">📈</div>统计</div>
    <div class="tab-item" onclick="switchTab('msg',this)"><div class="tab-icon">🔔</div>消息</div>
    <div class="tab-item" onclick="switchTab('mine',this)"><div class="tab-icon">👤</div>我的</div>
  </div>

<script>
  const SP_URL = 'https://stsfiyzfyfwpbqjkrwbl.supabase.co';
  const SP_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0c2ZpeXpmeWZ3cGJxamtyd2JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTI5NzIsImV4cCI6MjEwOTEyODk3Mn0.TuPWBTPMmi9y06XQAGZsxaTq7vTijyuwRI3pktXBrAQ';
  const STORAGE_KEY = 'FDZY_DATA_V4', LOGIN_KEY = 'FDZY_PHONE_V4';
  const ALL_FAC = ['空调','热水器','床','衣柜','桌椅','洗衣机','冰箱','宽带','智能锁'];

  let currentPhone = localStorage.getItem(LOGIN_KEY) || '';
  let activeRoomIdx = -1, roomFilter = 'ALL';
  let tempExtraFees = [];

  let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || { adminPhone:'', restrictMgr:false, managers:[], rooms:[], pastTenants:[], bills:[], repairs:[], expenses:[], ledger:[] };

  function isBoss(){ return !db.adminPhone || currentPhone === db.adminPhone; }
  function setSyncBadge(t, warn){ const el = document.getElementById('sync-status'); el.innerText=t; el.style.color=warn?'#ff7d00':'#00b42a'; el.style.background=warn?'#fff4e8':'#e8ffea'; }

  async function syncFromCloud(manual){
    setSyncBadge('🔄 同步', true);
    try {
      const res = await fetch(`${SP_URL}/rest/v1/store?id=eq.1&select=data`, { headers: { 'apikey':SP_KEY, 'Authorization':`Bearer ${SP_KEY}` } });
      if(!res.ok) throw new Error();
      const rows = await res.json();
      if(rows.length > 0 && rows[0].data) db = Object.assign(db, rows[0].data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      setSyncBadge('☁️ 已同步', false); if(manual && db.adminPhone) alert('云端数据已最新！');
      verifyAccess();
    } catch(e) { setSyncBadge('⚠️ 离线', true); verifyAccess(); }
  }

  async function saveDB(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); refreshDashboard();
    setSyncBadge('🔄 保存', true);
    try {
      const res = await fetch(`${SP_URL}/rest/v1/store`, { method:'POST', headers:{'apikey':SP_KEY,'Authorization':`Bearer ${SP_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'}, body:JSON.stringify({id:1, data:db}) });
      if(res.ok) setSyncBadge('☁️ 已同步', false); else throw new Error();
    } catch(e){ setSyncBadge('⚠️ 待同步', true); }
  }

  function verifyAccess(){
    const s = document.getElementById('auth-screen');
    if(!db.adminPhone){
      s.style.display = 'flex';
      document.getElementById('auth-form').innerHTML = `<input id="init-p" type="tel" class="search-input" style="width:100%;margin-bottom:16px;" placeholder="设置主房东手机号"><button class="btn" onclick="initAdmin()">绑定并开启系统</button>`;
      return;
    }
    if(currentPhone === db.adminPhone || (db.managers||[]).some(m => m.phone === currentPhone)){
      s.style.display = 'none'; document.getElementById('role-tag').innerText = isBoss()?'👑 主房东':'👤 管家';
      refreshDashboard(); renderManagersSection();
    } else {
      s.style.display = 'flex';
      document.getElementById('auth-form').innerHTML = `<input id="login-p" type="tel" class="search-input" style="width:100%;margin-bottom:16px;" placeholder="输入已授权的手机号"><button class="btn" onclick="doLogin()">极速免密登录</button>`;
    }
  }

  function initAdmin(){ const p = document.getElementById('init-p').value.trim(); if(p){ db.adminPhone=p; currentPhone=p; localStorage.setItem(LOGIN_KEY,p); saveDB(); verifyAccess(); } }
  function doLogin(){ const p = document.getElementById('login-p').value.trim(); if(p===db.adminPhone || (db.managers||[]).some(m=>m.phone===p)){ currentPhone=p; localStorage.setItem(LOGIN_KEY,p); verifyAccess(); } else alert('无权限！'); }
  function logoutPhone(){ currentPhone=''; localStorage.removeItem(LOGIN_KEY); verifyAccess(); }

  function closeModule(){ document.getElementById('module-modal').classList.remove('show'); refreshDashboard(); }
  function closeLv3(){ document.getElementById('lv3-modal').classList.remove('show'); document.getElementById('lv3-tabs').style.display='none'; }
  function closeAction(){ document.getElementById('action-sheet').classList.remove('show'); }

  function refreshDashboard(){
    const total = db.rooms.length, vacant = db.rooms.filter(r=>r.status==='vacant').length, rented = total - vacant;
    document.getElementById('st-total').innerText = total; document.getElementById('st-vacant').innerText = vacant;
    document.getElementById('st-rented').innerText = rented; document.getElementById('st-due').innerText = db.bills.filter(b=>b.status!=='paid').length;
    renderStatsTab();
    
    let msgs = [];
    db.bills.filter(b=>b.status!=='paid').forEach(b => msgs.push(`<div class="item-card" onclick="openModule('bills')"><div class="item-header"><span>💰 待收租：${b.roomName}</span><span class="badge red">${b.status==='unmetered'?'未抄表':'欠租'}</span></div><div class="item-row"><span>应收总额：¥${b.total}</span><span>${b.month}账单</span></div></div>`));
    db.repairs.filter(r=>r.status==='pending').forEach(r => msgs.push(`<div class="item-card"><div class="item-header"><span>🛠️ 报修：${r.roomName}</span><span class="badge orange">待处理</span></div><div class="item-row"><span>${r.desc}</span></div></div>`));
    document.getElementById('msg-list').innerHTML = msgs.length ? msgs.join('') : '<div class="empty-tip">暂无待办事项</div>';
  }

  // --- 模块入口 ---
  function openModule(type, filter='ALL'){
    document.getElementById('module-modal').classList.add('show');
    const title = document.getElementById('modal-title'), body = document.getElementById('modal-body');
    if(type === 'rooms'){
      title.innerText = '房源台账'; roomFilter = filter;
      body.innerHTML = `<div class="search-bar"><input id="rm-kw" class="search-input" placeholder="🔍 房号/姓名/手机" oninput="renderRoomsList()"></div>
        <div class="sub-tabs"><div class="sub-tab ${filter==='ALL'?'active':''}" onclick="roomFilter='ALL';renderRoomsList();this.parentElement.querySelectorAll('.sub-tab').forEach(e=>e.classList.remove('active'));this.classList.add('active')">全部房源</div><div class="sub-tab ${filter==='vacant'?'active':''}" onclick="roomFilter='vacant';renderRoomsList();this.parentElement.querySelectorAll('.sub-tab').forEach(e=>e.classList.remove('active'));this.classList.add('active')">只看空房</div><div class="sub-tab ${filter==='rented'?'active':''}" onclick="roomFilter='rented';renderRoomsList();this.parentElement.querySelectorAll('.sub-tab').forEach(e=>e.classList.remove('active'));this.classList.add('active')">只看已租</div></div>
        <div style="padding:12px;display:flex;gap:10px;"><button class="btn" style="flex:1" onclick="addSingleRoom()">+ 增添单间</button><button class="btn btn-outline" style="flex:1" onclick="bulkCreateRooms()">⚡ 批量建栋</button></div>
        <div id="rooms-list-box" class="card-list"></div>`;
      renderRoomsList();
    }
    else if(type === 'sign') renderSignPage(); else if(type === 'bills') renderBillsPage();
    else if(type === 'contracts') renderContractsPage(); else if(type === 'repairs') renderRepairsPage();
    else if(type === 'recruit'){
      title.innerText = '专属招租码';
      body.innerHTML = `<div class="item-card" style="margin:20px;text-align:center;padding:30px 20px;"><div class="section-title" style="margin-bottom:20px;">扫码查看最新空房</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.href)}" style="width:200px;height:200px;border-radius:12px;"><div style="font-size:13px;color:var(--sub);margin-top:20px;">长按保存图片发给中介或租客</div></div>`;
    }
  }

  // --- 房源列表与四级Tab详情 ---
  function renderRoomsList(){
    const kw = (document.getElementById('rm-kw')?.value||'').toLowerCase();
    const list = db.rooms.filter(r => (roomFilter==='ALL' || r.status===roomFilter) && (!kw || r.name.includes(kw) || (r.tenant||'').includes(kw) || (r.phone||'').includes(kw)));
    document.getElementById('rooms-list-box').innerHTML = list.map(r => {
      const idx = db.rooms.findIndex(x => x.id === r.id);
      return `<div class="item-card" onclick="openRoomTabs(${idx})"><div class="item-header"><span>${r.building}-${r.name} ${r.tenant?`(${r.tenant})`:''}</span><span class="badge ${r.status==='vacant'?'red':'blue'}">${r.status==='vacant'?'未录入租客':'已租'}</span></div><div class="item-row"><span>预设租金: ¥${r.rent}</span><span>${r.status==='vacant'?'点此入驻签约 ›':'点此看详情 ›'}</span></div></div>`;
    }).join('') || '<div class="empty-tip">未找到相关房源</div>';
  }

  function addSingleRoom(){
    const b = prompt('楼栋名 (如 1栋)：','1栋'), n = prompt('房间号 (如 101)：'); if(!n) return;
    const r = Number(prompt('月租金 (元)：','1500')||1500);
    db.rooms.push({ id:'RM_'+Date.now(), building:b, name:n, rent:r, waterPrice:6, elecPrice:1.2, lastWater:0, lastElec:0, facilities:['空调','热水器','床','门锁钥匙'], status:'vacant' });
    saveDB(); renderRoomsList();
  }
  function bulkCreateRooms(){
    const b = prompt('楼栋名称：','1栋'), f = Number(prompt('总楼层：','5')), p = Number(prompt('每层几间：','4')), r = Number(prompt('统一租金：','1200'));

  function saveRoomBasic(){ const r=db.rooms[activeRoomIdx]; r.rent=Number(document.getElementById('rt-rent').value); r.waterPrice=Number(document.getElementById('rt-wp').value); r.elecPrice=Number(document.getElementById('rt-ep').value); r.lastWater=Number(document.getElementById('rt-lw').value); r.lastElec=Number(document.getElementById('rt-le').value); saveDB(); alert('保存成功！'); }

  // --- 签约与生成账单逻辑 ---
  function renderSignPage(){
    const vacants = db.rooms.filter(r=>r.status==='vacant');
    if(!vacants.length){ document.getElementById('modal-body').innerHTML='<div class="empty-tip">没有空房，请先添加房源</div>'; return; }
    tempExtraFees=[]; const td = new Date().toISOString().slice(0,10), nd = new Date(new Date().setFullYear(new Date().getFullYear()+1)).toISOString().slice(0,10);
    document.getElementById('modal-title').innerText = '租客签约';
    document.getElementById('modal-body').innerHTML = `
      <div class="section-title" style="padding:10px 14px;">租客信息</div>
      <div class="cell-group"><div class="cell-row"><span class="cell-label">姓名<span class="req">*</span></span><input id="s-name" class="cell-input" placeholder="输入真实姓名"></div><div class="cell-row"><span class="cell-label">手机号<span class="req">*</span></span><input id="s-phone" type="tel" class="cell-input" placeholder="输入手机号"></div><div class="cell-row"><span class="cell-label">身份证号</span><input id="s-id" class="cell-input" placeholder="选填"></div></div>
      <div class="section-title" style="padding:10px 14px;">合同信息</div>
      <div class="cell-group"><div class="cell-row"><span class="cell-label">所租房间<span class="req">*</span></span><select id="s-rm" class="cell-select" onchange="syncSignUI()">${vacants.map(r=>`<option value="${r.id}">${r.building}-${r.name}</option>`).join('')}</select></div><div class="cell-row"><span class="cell-label">起租日期<span class="req">*</span></span><input id="s-start" type="date" class="cell-input" value="${td}"></div><div class="cell-row"><span class="cell-label">结束日期<span class="req">*</span></span><input id="s-end" type="date" class="cell-input" value="${nd}"></div><div class="cell-row"><span class="cell-label">每月收租日</span><input id="s-payday" type="number" class="cell-input" value="1" placeholder="如:1号"></div></div>
      <div class="section-title" style="padding:10px 14px;">费用项目 (签约底数)</div>
      <div class="cell-group"><div class="cell-row"><span class="cell-label">月租金(元)<span class="req">*</span></span><input id="s-rent" type="number" class="cell-input" value="${vacants[0].rent}"></div><div class="cell-row"><span class="cell-label">押金(元)<span class="req">*</span></span><input id="s-dep" type="number" class="cell-input" value="${vacants[0].rent}"></div><div class="cell-row"><span class="cell-label">水底数(方)</span><input id="s-w" type="number" class="cell-input" value="${vacants[0].lastWater||0}"></div><div class="cell-row"><span class="cell-label">电底数(度)</span><input id="s-e" type="number" class="cell-input" value="${vacants[0].lastElec||0}"></div><div id="s-extra-box"></div><div class="cell-row" style="justify-content:center;color:var(--primary);cursor:pointer;" onclick="addSignFee()">+ 增加自定义费用 (如物业费/网费)</div></div>
      <div style="padding:20px 16px;"><button class="btn" onclick="submitSign()">保存合同，并生成首期账单</button></div>`;
  }
  function syncSignUI(){ const rm=db.rooms.find(r=>r.id===document.getElementById('s-rm').value); if(rm){ document.getElementById('s-rent').value=rm.rent; document.getElementById('s-dep').value=rm.rent; document.getElementById('s-w').value=rm.lastWater||0; document.getElementById('s-e').value=rm.lastElec||0; } }
  function addSignFee(){ const n=prompt('费用名:'); if(n){ tempExtraFees.push({name:n,amt:Number(prompt(`[${n}]金额:`)||0)}); document.getElementById('s-extra-box').innerHTML=tempExtraFees.map(f=>`<div class="cell-row"><span>${f.name}</span><span>¥${f.amt}</span></div>`).join(''); } }
  
  function submitSign(){
    const nm = document.getElementById('s-name').value.trim(), ph = document.getElementById('s-phone').value.trim(); if(!nm||!ph) return alert('请填写姓名和手机！');
    const rm = db.rooms.find(r=>r.id===document.getElementById('s-rm').value);
    rm.status='rented'; rm.tenant=nm; rm.phone=ph; rm.idCard=document.getElementById('s-id').value; rm.startDate=document.getElementById('s-start').value; rm.endDate=document.getElementById('s-end').value; rm.payDay=document.getElementById('s-payday').value;
    rm.rent=Number(document.getElementById('s-rent').value); rm.deposit=Number(document.getElementById('s-dep').value); rm.lastWater=Number(document.getElementById('s-w').value); rm.lastElec=Number(document.getElementById('s-e').value); rm.extraFees=[...tempExtraFees];
    const ex=rm.extraFees.reduce((s,f)=>s+f.amt,0);
    db.bills.unshift({ id:'BL_'+Date.now(), roomId:rm.id, building:rm.building, roomName:`${rm.building}-${rm.name}`, tenant:rm.tenant, month:rm.startDate.slice(0,7), total:(rm.rent+ex).toFixed(2), paidAmount:0, detail:`租金¥${rm.rent}`+(ex?`+杂费¥${ex}`:'')+' (待抄水电)', status:'unmetered' });
    saveDB(); closeModule(); alert('签约成功！已生成待抄表账单。');
  }

  // --- 智能抄表算费表单 (Action Sheet) ---
  function openMeterForm(bIdx){
    const b = db.bills[bIdx], r = db.rooms.find(x=>x.id===b.roomId);
    document.getElementById('action-sheet').classList.add('show');
    document.getElementById('action-title-text').innerText = `录入读数：${b.roomName}`;
    document.getElementById('action-body').innerHTML = `
      <div class="cell-group" style="margin:0;"><div class="cell-row"><span class="cell-label" style="font-weight:700;">💧 水表计算</span><span style="font-size:12px;color:var(--sub)">单价: ¥${r.waterPrice||6}</span></div><div class="cell-row"><span class="cell-label">上期底数</span><span>${r.lastWater||0}</span></div><div class="cell-row"><span class="cell-label">本次读数</span><input id="am-w" type="number" class="cell-input" style="font-size:18px;color:var(--primary);font-weight:700;" placeholder="请输入" oninput="calcMeter(${bIdx})"></div><div class="cell-row" style="background:#fafafa;"><span class="cell-label">本月用量</span><span id="am-w-use">0 方</span></div></div>
      <div class="cell-group" style="margin:16px 0;"><div class="cell-row"><span class="cell-label" style="font-weight:700;">⚡ 电表计算</span><span style="font-size:12px;color:var(--sub)">单价: ¥${r.elecPrice||1.2}</span></div><div class="cell-row"><span class="cell-label">上期底数</span><span>${r.lastElec||0}</span></div><div class="cell-row"><span class="cell-label">本次读数</span><input id="am-e" type="number" class="cell-input" style="font-size:18px;color:var(--primary);font-weight:700;" placeholder="请输入" oninput="calcMeter(${bIdx})"></div><div class="cell-row" style="background:#fafafa;"><span class="cell-label">本月用量</span><span id="am-e-use">0 度</span></div></div>
      <div style="font-size:20px;font-weight:700;text-align:right;margin-bottom:16px;">合计总额：<span id="am-total" style="color:var(--danger)">¥${b.total}</span></div>
      <button class="btn" onclick="saveMeterForm(${bIdx})">保存读数并出账单</button>`;
  }
  function calcMeter(bIdx){
    const b = db.bills[bIdx], r = db.rooms.find(x=>x.id===b.roomId);
    const cw = Number(document.getElementById('am-w').value||r.lastWater||0), ce = Number(document.getElementById('am-e').value||r.lastElec||0);
    const uw = Math.max(0, cw-(r.lastWater||0)), ue = Math.max(0, ce-(r.lastElec||0));
    document.getElementById('am-w-use').innerText = `${uw} 方`; document.getElementById('am-e-use').innerText = `${ue} 度`;
    const ex = (r.extraFees||[]).reduce((s,f)=>s+f.amt,0);
    document.getElementById('am-total').innerText = `¥${(r.rent + uw*(r.waterPrice||6) + ue*(r.elecPrice||1.2) + ex).toFixed(2)}`;
  }
  function saveMeterForm(bIdx){
    const b = db.bills[bIdx], r = db.rooms.find(x=>x.id===b.roomId);
    const cw = Number(document.getElementById('am-w').value), ce = Number(document.getElementById('am-e').value);
    if(!cw || !ce) return alert('请输入本月读数！');
    const uw = Math.max(0, cw-(r.lastWater||0)), ue = Math.max(0, ce-(r.lastElec||0));
    const wf = uw*(r.waterPrice||6), ef = ue*(r.elecPrice||1.2), ex = (r.extraFees||[]).reduce((s,f)=>s+f.amt,0);
    r.lastWater = cw; r.lastElec = ce; b.total = (r.rent+wf+ef+ex).toFixed(2);
    b.detail = `租金¥${r.rent}+水¥${wf}+电¥${ef}`+(ex?`+杂¥${ex}`:''); b.status = 'unpaid';
    saveDB(); closeAction(); renderBillsList();
  }

  // --- 全楼批量抄表 (独家优势保留) ---
  function openBulkMeter(){
    const rented = db.rooms.filter(r=>r.status==='rented'); if(!rented.length) return alert('无在租房间！');
    document.getElementById('module-modal').classList.add('show'); document.getElementById('modal-title').innerText = '集中抄表出单';
    document.getElementById('modal-body').innerHTML = `<div style="padding:14px;font-size:13px;color:var(--sub);background:#fff9ed;">输入最新读数，系统自动减去上月底数并批量出账单。</div><div class="card-list">${rented.map((r,i)=>`<div class="item-card"><div class="item-header"><span>${r.building}-${r.name} (${r.tenant})</span></div><div style="display:flex;gap:12px;margin-top:10px;"><div style="flex:1;"><div style="font-size:12px;color:var(--sub);">水 (底数:${r.lastWater||0})</div><input id="bm-w-${i}" type="number" class="search-input" style="width:100%;margin-top:6px;border:1px solid #e5e5e5;" placeholder="新读数"></div><div style="flex:1;"><div style="font-size:12px;color:var(--sub);">电 (底数:${r.lastElec||0})</div><input id="bm-e-${i}" type="number" class="search-input" style="width:100%;margin-top:6px;border:1px solid #e5e5e5;" placeholder="新读数"></div></div></div>`).join('')}<button class="btn" style="margin-top:10px;" onclick="submitBulkMeter()">⚡ 一键生成本月全楼账单</button></div>`;
  }
  function submitBulkMeter(){
    const rented = db.rooms.filter(r=>r.status==='rented'), curM = new Date().toISOString().slice(0,7);
    rented.forEach((rm, i) => {
      const cw = Number(document.getElementById(`bm-w-${i}`).value||rm.lastWater||0), ce = Number(document.getElementById(`bm-e-${i}`).value||rm.lastElec||0);
      const uw = Math.max(0,cw-(rm.lastWater||0)), ue = Math.max(0,ce-(rm.lastElec||0));
      const wf = uw*(rm.waterPrice||6), ef = ue*(rm.elecPrice||1.2), ex = (rm.extraFees||[]).reduce((s,f)=>s+f.amt,0);
      rm.lastWater = cw; rm.lastElec = ce;
      db.bills.unshift({ id:'BL_'+Date.now()+'_'+i, roomId:rm.id, building:rm.building, roomName:`${rm.building}-${rm.name}`, tenant:rm.tenant, month:curM, total:(rm.rent+wf+ef+ex).toFixed(2), paidAmount:0, detail:`租金¥${rm.rent}+水¥${wf}+电¥${ef}`+(ex?`+杂¥${ex}`:''), status:'unpaid' });
    });
    saveDB(); closeModule(); alert('批量出单完毕！');
  }

  // --- 收银台单据交互 ---
  function openPayForm(bIdx){
    const b = db.bills[bIdx], rem = (Number(b.total)-Number(b.paidAmount||0)).toFixed(2);
    document.getElementById('action-sheet').classList.add('show'); document.getElementById('action-title-text').innerText = `收银入账：${b.roomName}`;
    document.getElementById('action-body').innerHTML = `<div class="cell-group" style="margin:0 0 16px;"><div class="cell-row"><span class="cell-label">账单总额</span><span style="font-weight:700;">¥${b.total}</span></div><div class="cell-row"><span class="cell-label">剩余待收</span><span style="font-weight:700;color:var(--danger);font-size:18px;">¥${rem}</span></div><div class="cell-row"><span class="cell-label">本次实收</span><input id="pay-a" type="number" class="cell-input" style="font-size:18px;color:var(--success);font-weight:700;" value="${rem}"></div><div class="cell-row"><span class="cell-label">收款方式</span><select id="pay-w" class="cell-select"><option>微信收款</option><option>支付宝</option><option>现金</option></select></div></div><button class="btn" style="background:var(--success);" onclick="confirmPay(${bIdx})">确认已收款</button>`;
  }
  function confirmPay(bIdx){
    const b = db.bills[bIdx], amt = Number(document.getElementById('pay-a').value||0), w = document.getElementById('pay-w').value;
    b.paidAmount = (Number(b.paidAmount||0) + amt).toFixed(2);

    saveDB(); closeAction(); renderBillsList();
  }

  // --- 双向对冲退租结算 ---
  function openCheckoutHome(){
    document.getElementById('module-modal').classList.add('show'); document.getElementById('modal-title').innerText = '退租结算中心';
    document.getElementById('modal-body').innerHTML = `<div class="card-list">${db.rooms.filter(r=>r.status==='rented').map(r=>`<div class="item-card"><div class="item-header"><span>${r.building}-${r.name} (${r.tenant})</span><span class="badge blue">押金 ¥${r.deposit||0}</span></div><div style="text-align:right;margin-top:12px;"><button class="btn-sm danger" onclick="openCheckoutForm('${r.id}')">发起退租核算</button></div></div>`).join('')||'<div class="empty-tip">当前无在租房间</div>'}</div>`;
  }
  function openCheckoutForm(rId){
    const r = db.rooms.find(x=>x.id===rId);
    document.getElementById('action-sheet').classList.add('show'); document.getElementById('action-title-text').innerText = `退租结算：${r.roomName||r.name}`;
    document.getElementById('action-body').innerHTML = `<div class="cell-group" style="margin:0 0 12px;"><div class="cell-row"><span class="cell-label">应退租客金额</span><span style="font-weight:700;color:var(--primary);">¥${r.deposit||0} (在押押金)</span></div></div><div class="section-title" style="padding-left:4px;font-size:14px;">扣除项目 (应收)</div><div class="cell-group" style="margin:0 0 16px;"><div class="cell-row"><span class="cell-label">水电/物损扣款</span><input id="co-deduct" type="number" class="cell-input" style="font-weight:700;color:var(--danger);" placeholder="输入金额" oninput="calcCheckout(${r.deposit||0})"></div><div class="cell-row" style="background:#fafafa;"><span class="cell-label">实退净额</span><span id="co-net" style="font-weight:700;font-size:18px;">¥${r.deposit||0}</span></div></div><button class="btn" style="background:var(--danger);" onclick="confirmCheckout('${rId}')">确认清退并释放房源</button>`;
  }
  function calcCheckout(dep){ const d=Number(document.getElementById('co-deduct').value||0); document.getElementById('co-net').innerText = `¥${(dep-d).toFixed(2)}`; }
  function confirmCheckout(rId){
    const r = db.rooms.find(x=>x.id===rId), deduct = Number(document.getElementById('co-deduct').value||0), net = (Number(r.deposit||0)-deduct).toFixed(2);
    db.pastTenants.unshift({ building:r.building, name:r.name, tenant:r.tenant, phone:r.phone, checkoutDate:new Date().toISOString().slice(0,10), settleNote:`押金¥${r.deposit} 扣费¥${deduct} 实退¥${net}` });
    r.status = 'vacant'; delete r.tenant; delete r.phone; saveDB(); closeAction(); openCheckoutHome(); alert('退房成功，房间已变为空置！');
  }

  // --- 其他基础模块 (财务, 导航等) ---
  function renderStatsTab(){
    const box=document.getElementById('tab-stats'); if(!canEditCritical()){ box.innerHTML='<div class="empty-tip">🔒 仅主房东可看财务</div>'; return; }
    const inC = (db.ledger||[]).filter(l=>l.type==='in').reduce((s,l)=>s+Number(l.amount),0), exC = (db.expenses||[]).reduce((s,e)=>s+Number(e.amount),0);
    box.innerHTML = `<div class="item-card" style="background:linear-gradient(135deg, #19be6b, #3b6ef6);color:#fff;"><div style="font-size:14px;opacity:0.9;">真实净利润 (收租-支出)</div><div style="font-size:32px;font-weight:700;margin:10px 0;">¥${(inC-exC).toFixed(2)}</div><div style="display:flex;justify-content:space-between;font-size:12px;opacity:0.9;"><span>总实收: ¥${inC.toFixed(2)}</span><span>总支出: ¥${exC.toFixed(2)}</span></div></div><button class="btn btn-outline" style="margin-bottom:16px;" onclick="addExpensePrompt()">+ 记一笔日常支出</button><div class="section-title">收支流水账 (按时间倒序)</div><div class="cell-group">${(db.ledger||[]).slice(0,30).map(l=>`<div class="cell-row"><div><div style="font-weight:500;font-size:15px;">${l.title}</div><div style="font-size:12px;color:var(--sub);margin-top:4px;">${l.date}</div></div><div style="font-weight:700;font-size:18px;color:${l.type==='in'?'var(--success)':'var(--danger)'}">${l.type==='in'?'+':'-'}¥${Number(l.amount).toFixed(2)}</div></div>`).join('')||'<div class="empty-tip">暂无流水记录</div>'}</div>`;
  }
  function addExpensePrompt(){ const cat=prompt('支出名(如维修费):'); if(cat){ const amt=Number(prompt('金额:')); if(amt){ db.expenses.unshift({cat,amount:amt}); db.ledger.unshift({type:'out',title:`[支出] ${cat}`,amount:amt,date:new Date().toISOString().slice(0,10)}); saveDB(); } } }
  
  function renderManagersSection(){
    document.getElementById('cur-user-phone').innerText = currentPhone||'未设置';
    document.getElementById('managers-list-box').innerHTML = `<div class="cell-group" style="margin:0;"><div class="cell-row"><span>主账号 (${db.adminPhone||'本机'})</span><span class="badge blue">最高权限</span></div>${(db.managers||[]).map((m,i)=>`<div class="cell-row"><span>${m.name} (${m.phone})</span>${isBoss()?`<span class="badge red" onclick="db.managers.splice(${i},1);saveDB();renderManagersSection()">移除</span>`:'<span class="badge">管家</span>'}</div>`).join('')}</div>${isBoss()?`<div style="display:flex;gap:10px;margin-top:14px;"><input id="m-n" class="search-input" style="background:#f0f0f0;flex:1" placeholder="管家称呼"><input id="m-p" type="tel" class="search-input" style="background:#f0f0f0;flex:1.5" placeholder="管家手机号"><button class="btn" style="width:auto;padding:10px 16px;" onclick="addManager()">添加</button></div>`:''}`;
  }
  function addManager(){ const n=document.getElementById('m-n').value, p=document.getElementById('m-p').value; if(p){ db.managers.push({name:n||'管家',phone:p}); saveDB(); renderManagersSection(); } }

  function switchTab(tab, el){ ['workbench','stats','msg','mine'].forEach(t => document.getElementById('tab-'+t).style.display = (t===tab)?'block':'none'); document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active')); if(el) el.classList.add('active'); if(tab==='mine') renderManagersSection(); if(tab==='stats') renderStatsTab(); }
  
  syncFromCloud(false);
</script>
</body>
</html>

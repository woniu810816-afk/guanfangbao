<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="房东之友">
  <title>房东之友</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#111; --sub:#86909c; --primary:#2b70fa; --danger:#f53f3f; --success:#18b566; --warn:#ff8800; --border:#eee; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    body { background:var(--bg); color:var(--text); padding-bottom:75px; user-select:none; }
    .navbar { position:sticky; top:0; z-index:100; background:var(--bg); height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:17px; font-weight:700; border-bottom:1px solid rgba(0,0,0,0.04); }
    .sync-badge { font-size:12px; font-weight:500; color:var(--success); background:#e6f7ed; padding:4px 10px; border-radius:12px; cursor:pointer; }
    .container { padding:12px 14px; }
    .section-title { font-size:16px; font-weight:700; margin:8px 2px 12px; color:#111; display:flex; justify-content:space-between; align-items:center; }

    /* 首页数据预览与工作台 */
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
    .stat-card { background:var(--card); border-radius:10px; padding:15px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .stat-label { font-size:14px; color:#333; line-height:1.4; }
    .stat-num { font-size:24px; font-weight:700; color:#111; }
    .workbench-card { background:var(--card); border-radius:12px; padding:22px 10px 14px; display:grid; grid-template-columns:repeat(3,1fr); gap:20px 8px; }
    .wb-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
    .wb-icon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; font-weight:700; margin-bottom:7px; }
    .wb-label { font-size:13px; color:#222; }

    /* 顶部横向Tab与筛选栏 */
    .sub-tabs { display:flex; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:15; }
    .sub-tab { flex:1; text-align:center; padding:12px 0; font-size:14px; color:#555; cursor:pointer; position:relative; }
    .sub-tab.active { color:var(--primary); font-weight:700; }
    .sub-tab.active::after { content:''; position:absolute; bottom:0; left:25%; right:25%; height:3px; background:var(--primary); border-radius:2px; }
    .search-bar { background:var(--card); padding:10px 14px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--border); }
    .search-input { flex:1; background:#f5f6f8; border:1px solid #e5e5e5; border-radius:6px; padding:8px 12px; font-size:14px; outline:none; }
    .search-btn { background:var(--primary); color:#fff; border:none; border-radius:6px; padding:8px 14px; font-size:14px; font-weight:500; cursor:pointer; }
    .filter-row { background:var(--card); padding:8px 14px; display:flex; gap:8px; border-bottom:1px solid var(--border); }
    .filter-pill { flex:1; background:#f7f8fa; border:1px solid #e5e5e5; border-radius:6px; padding:7px 6px; font-size:13px; color:#333; outline:none; text-align:center; }

    /* 房间双列方格卡片 (1:1还原原版红绿卡片) */
    .floor-title { padding:12px 14px 6px; font-size:14px; color:#333; font-weight:600; }
    .room-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 14px 12px; }
    .rm-box { border-radius:8px; padding:12px; cursor:pointer; position:relative; }
    .rm-box.vacant { background:#ffece8; }
    .rm-box.rented { background:#d8f5e5; }
    .rm-box-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .rm-box-no { font-size:19px; font-weight:700; color:#111; }
    .rm-tag { font-size:11px; padding:2px 6px; border-radius:4px; color:#fff; font-weight:600; }
    .rm-tag.vacant { background:#f53f3f; }
    .rm-tag.rented { background:#18b566; }
    .rm-tag.orange { background:#ff8800; }
    .rm-box-line { font-size:13px; color:#444; margin-top:3px; }
    .rm-box-date { font-size:12px; color:#f53f3f; margin-top:4px; }

    /* 通用卡片与表单 */
    .card-list { padding:12px 14px; }
    .item-card { background:var(--card); border-radius:10px; padding:14px 16px; margin-bottom:10px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.03); }
    .item-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-weight:700; font-size:16px; }
    .item-row { font-size:13px; color:#666; margin:4px 0; display:flex; justify-content:space-between; align-items:center; }
    .group-title { padding:12px 14px 6px; font-size:14px; color:#666; font-weight:600; }
    .cell-group { background:var(--card); margin-bottom:10px; padding:0 14px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .cell-row { display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid #f2f2f2; font-size:15px; }
    .cell-row:last-child { border-bottom:none; }
    .cell-label { color:#222; min-width:105px; }
    .req { color:var(--danger); margin-left:2px; }
    .cell-input, .cell-select { flex:1; border:none; text-align:right; font-size:15px; color:#111; background:transparent; outline:none; }
    .fee-box { background:#f4f8ff; border-radius:8px; padding:4px 12px; margin:8px 0; }
    .photo-box { padding:12px 0; }
    .photo-list { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
    .photo-item { width:72px; height:72px; border-radius:6px; object-fit:cover; border:1px solid #ddd; }
    .photo-add { width:72px; height:72px; border:1px dashed #bbb; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#888; font-size:12px; cursor:pointer; background:#fafafa; }

    /* 按钮 */
    .btn { width:100%; padding:12px; border:none; border-radius:24px; background:var(--primary); color:#fff; font-size:16px; font-weight:600; cursor:pointer; text-align:center; }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-outline { background:#eef3fe; color:var(--primary); }
    .btn-sm { padding:5px 12px; font-size:12px; border-radius:14px; border:none; cursor:pointer; background:#f0f2f5; color:#333; font-weight:500; }
    .btn-sm.primary { background:var(--primary); color:#fff; }
    .btn-sm.danger { background:#ffece8; color:var(--danger); }

    /* 收据表格 */
    .receipt-table { width:100%; border-collapse:collapse; margin:12px 0; font-size:13px; text-align:center; }
    .receipt-table th { background:#f5d6a7; color:#222; padding:8px 4px; border:1px solid #d4b28c; font-weight:600; }
    .receipt-table td { padding:8px 4px; border:1px solid #e5e5e5; color:#333; }

    /* 模态框层级 */
    .modal { position:fixed; inset:0; background:var(--bg); z-index:200; overflow-y:auto; display:none; padding-bottom:80px; }
    .modal.show { display:block; }
    .modal-lv3 { z-index:250; }
    .modal-lv4 { z-index:300; }
    .modal-header { position:sticky; top:0; background:var(--card); height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; border-bottom:1px solid var(--border); font-weight:700; font-size:16px; z-index:30; }
    .back-btn { font-size:22px; cursor:pointer; color:#111; width:60px; font-weight:400; }
    .dialog-mask { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:400; display:none; align-items:center; justify-content:center; padding:20px; }
    .dialog-mask.show { display:flex; }
    .dialog-box { background:#fff; border-radius:14px; width:100%; max-width:340px; padding:20px; max-height:85vh; overflow-y:auto; }
    .sheet-mask { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:380; display:none; flex-direction:column; justify-content:flex-end; }
    .sheet-mask.show { display:flex; }
    .sheet-box { background:#fff; border-radius:16px 16px 0 0; padding:18px; max-height:85vh; overflow-y:auto; }

    .tabbar { position:fixed; bottom:0; left:0; right:0; height:56px; background:var(--card); display:flex; border-top:1px solid var(--border); z-index:100; }
    .tab-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#7a7e83; font-size:11px; cursor:pointer; }
    .tab-item.active { color:var(--primary); font-weight:600; }
    .tab-icon { font-size:20px; margin-bottom:2px; }
    .empty-tip { text-align:center; color:#999; padding:48px 0; font-size:14px; }
  </style>
</head>
<body>

  <!-- 登录拦截层 -->
  <div id="auth-screen" class="dialog-mask" style="background:var(--bg);z-index:500;">
    <div class="dialog-box">
      <div style="width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">房</div>
      <div style="text-align:center;font-size:19px;font-weight:700;margin-bottom:18px;">房东之友</div>
      <div id="auth-form"></div>
    </div>
  </div>

  <div class="navbar">
    <span style="font-size:13px;color:var(--primary);width:80px;" id="role-tag">👑 主房东</span>
    <span id="app-title">房东之友</span>
    <span class="sync-badge" id="sync-status" onclick="syncFromCloud(true)">☁️ 已同步</span>
  </div>

  <!-- 1. 工作台首页 -->
  <div id="tab-workbench" class="container">
    <div class="section-title">数据预览</div>
    <div class="stats-grid">
      <div class="stat-card" onclick="openModule('buildings')"><div class="stat-label">全部<br>房间数</div><div class="stat-num" id="st-total">0</div></div>
      <div class="stat-card" onclick="openQuickList('vacant')"><div class="stat-label">空房数 ›</div><div class="stat-num" style="color:var(--danger)" id="st-vacant">0</div></div>
      <div class="stat-card" onclick="openQuickList('expiring')"><div class="stat-label">快到期 ›<br>房间数</div><div class="stat-num" id="st-expiring">0</div></div>
      <div class="stat-card" onclick="openCalendarPage()"><div class="stat-label">今日要收 ›<br>租房间数</div><div class="stat-num" style="color:var(--primary)" id="st-due">0</div></div>
    </div>
    <div class="section-title">工作台</div>
    <div class="workbench-card">
      <div class="wb-item" onclick="openModule('buildings')"><div class="wb-icon" style="background:#5396ff">🏢</div><div class="wb-label">我的房源</div></div>
      <div class="wb-item" onclick="openModule('contracts')"><div class="wb-icon" style="background:#c55df6">📄</div><div class="wb-label">租客/合同</div></div>
      <div class="wb-item" onclick="openModule('recruit')"><div class="wb-icon" style="background:#ff9d5c">🏠</div><div class="wb-label">招租</div></div>
      <div class="wb-item" onclick="openModule('sign')"><div class="wb-icon" style="background:#ff7e47">✍️</div><div class="wb-label">租客签约</div></div>
      <div class="wb-item" onclick="openModule('bills')"><div class="wb-icon" style="background:#6467f0">¥</div><div class="wb-label">收租/账单</div></div>
      <div class="wb-item" onclick="openModule('checkout')"><div class="wb-icon" style="background:#f25781">退</div><div class="wb-label">退租</div></div>
      <div class="wb-item" onclick="openModule('repairs')"><div class="wb-icon" style="background:#148e99">🛠️</div><div class="wb-label">报修</div></div>
      <div class="wb-item" onclick="openBulkMeter()"><div class="wb-icon" style="background:#20b2aa">⚡</div><div class="wb-label">集中抄表</div></div>
      <div class="wb-item" onclick="switchTab('stats',document.querySelectorAll('.tab-item')[1])"><div class="wb-icon" style="background:#18b566">📊</div><div class="wb-label">财务统计</div></div>
    </div>
  </div>

  <!-- 2. 统计页 -->
  <div id="tab-stats" class="container" style="display:none;"></div>

  <!-- 3. 消息通知页 -->
  <div id="tab-msg" class="container" style="display:none;">
    <div class="filter-row" style="margin:-12px -14px 12px;">
      <select id="msg-type-filter" class="filter-pill" onchange="renderMsgTab()">
        <option value="ALL">全部类型</option>
        <option value="meter">抄表通知</option>
        <option value="expiring">房间快到期通知</option>
        <option value="repair">报修通知</option>
        <option value="checkout">退租单未结算通知</option>
      </select>
    </div>
    <div id="msg-list"></div>
  </div>

  <!-- 4. 我的页面 -->
  <div id="tab-mine" class="container" style="display:none;">
    <div class="item-card" style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:17px;font-weight:700;" id="cur-user-title">用户</div>
        <div style="font-size:13px;color:#666;margin-top:4px;" id="cur-user-phone"></div>
      </div>
      <button class="btn-sm danger" onclick="logoutPhone()">退出登录</button>
    </div>
    <div class="stats-grid" style="margin-bottom:12px;">
      <div class="item-card" style="margin:0;"><div style="font-size:13px;color:#666;">管房组</div><div style="font-size:16px;font-weight:700;color:var(--danger);margin-top:6px;" id="group-name-txt" onclick="editGroupName()">默认小区 ✎</div></div>
      <div class="item-card" style="margin:0;"><div style="font-size:13px;color:#666;">当前套餐</div><div style="font-size:16px;font-weight:700;margin-top:6px;">终身免费旗舰版</div></div>
    </div>
    <div class="section-title">👨‍👩‍👧 协管员与权限控制</div>
    <div class="item-card" id="managers-list-box"></div>
    <div class="section-title">数据安全备份</div>
    <div class="item-card">
      <button class="btn btn-outline" style="margin-bottom:10px;" onclick="exportData()">📤 导出全部数据备份 (.json)</button>
      <label class="btn btn-outline" style="display:block;">📥 从备份文件恢复数据<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
    </div>
  </div>

  <!-- 二级页面弹窗 -->
  <div id="module-modal" class="modal">
    <div class="modal-header"><span class="back-btn" onclick="closeModule()">‹</span><span id="modal-title">列表</span><span id="modal-right" style="width:60px;text-align:right;font-size:13px;color:var(--primary);cursor:pointer;"></span></div>
    <div id="modal-body"></div>
  </div>

  <!-- 三级页面弹窗 -->
  <div id="lv3-modal" class="modal modal-lv3">
    <div class="modal-header"><span class="back-btn" onclick="closeLv3()">‹</span><span id="lv3-title">详情</span><span id="lv3-right" style="width:60px;text-align:right;font-size:13px;color:var(--primary);cursor:pointer;"></span></div>
    <div id="lv3-body"></div>
  </div>

  <!-- 四级页面弹窗 (合同详情/编辑账单/房租收据/费用勾选) -->
  <div id="lv4-modal" class="modal modal-lv4">
    <div class="modal-header"><span class="back-btn" onclick="closeLv4()">‹</span><span id="lv4-title">详情</span><span style="width:60px;"></span></div>
    <div id="lv4-body"></div>
  </div>

  <!-- 底部抽屉与居中弹窗 -->
  <div id="sheet-modal" class="sheet-mask"><div class="sheet-box" id="sheet-body"></div></div>
  <div id="common-dialog" class="dialog-mask"><div class="dialog-box" id="common-dialog-body"></div></div>

  <div class="tabbar">
    <div class="tab-item active" onclick="switchTab('workbench',this)"><div class="tab-icon">❖</div>工作台</div>
    <div class="tab-item" onclick="switchTab('stats',this)"><div class="tab-icon">📈</div>统计</div>
    <div class="tab-item" onclick="switchTab('msg',this)"><div class="tab-icon">🔔</div>消息通知</div>
    <div class="tab-item" onclick="switchTab('mine',this)"><div class="tab-icon">👤</div>我的</div>
  </div>

<script>
  // 修正首字母小写 eyJ 的有效 Supabase JWT 密钥
  const SP_URL = 'https://stsfiyzfyfwpbqjkrwbl.supabase.co';
  const SP_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0c2ZpeXpmeWZ3cGJxamtyd2JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTI5NzIsImV4cCI6MjEwOTEyODk3Mn0.TuPWBTPMmi9y06XQAGZsxaTq7vTijyuwRI3pktXBrAQ';
  const STORAGE_KEY = 'FDZY_PRO_DB', LOGIN_KEY = 'FDZY_LOGIN_PHONE';
  const EXTRA_FEE_TYPES = ['卫生管理费','电梯费','电视费','网络费','物业费','钥匙押金','燃气'];
  const ALL_FAC = ['空调','热水器','床','衣柜','桌椅','洗衣机','冰箱','宽带','智能锁'];

  let currentPhone = localStorage.getItem(LOGIN_KEY) || '';
  let curBldg = '', rmFilter = 'ALL', curRmIdx = -1, curRoomTab = 'basic', contractTab = 'active', repairTab = 'pending';
  let signIdPhotos = [], signContractPhotos = [], signSelectedFees = {}, checkoutRefunds = [], checkoutCharges = [];

  // 兼容合并旧版本本地缓存数据，绝不丢失之前录入的房源
  let rawLocal = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('FDZY_DATA_V5') || localStorage.getItem('FDZY_DATA_V4') || localStorage.getItem('FDZY_DATA') || 'null';
  let db = Object.assign({
    adminPhone:'', groupName:'滨苑小区', restrictMgr:false, managers:[], buildings:['32号'], rooms:[], pastTenants:[], bills:[], draftCheckouts:[], repairs:[], expenses:[], ledger:[], scanCount:0
  }, JSON.parse(rawLocal) || {});

  function isBoss(){ return !db.adminPhone || currentPhone === db.adminPhone; }
  function canEditCritical(){ return isBoss() || !db.restrictMgr; }
  function setSyncBadge(t, warn){
    const el = document.getElementById('sync-status');
    if(el){ el.innerText = t; el.style.color = warn ? '#ff8800' : '#18b566'; el.style.background = warn ? '#fff4e8' : '#e6f7ed'; }
  }

  async function syncFromCloud(manual){
    setSyncBadge('🔄 同步中', true);
    try {
      const res = await fetch(`${SP_URL}/rest/v1/store?id=eq.1&select=data`, {
        headers: { 'apikey': SP_KEY, 'Authorization': `Bearer ${SP_KEY}` }
      });
      if(!res.ok) throw new Error();
      const rows = await res.json();
      if(rows.length > 0 && rows[0].data) {
        db = Object.assign(db, rows[0].data);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } else if(db.rooms.length > 0) {
        await saveDB();
      }
      setSyncBadge('☁️ 已同步', false);
      if(manual) alert('✅ 已与新加坡云数据库同步最新数据！');
      verifyAccess();
    } catch(e) {
      setSyncBadge('⚠️ 本地缓存', true);
      verifyAccess();
    }
  }

  async function saveDB(){
    // 自动归集所有楼栋名
    db.buildings = db.buildings || [];
    db.rooms.forEach(r => { if(r.building && !db.buildings.includes(r.building)) db.buildings.push(r.building); });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    refreshDashboard();
    setSyncBadge('🔄 保存中', true);
    try {
      const res = await fetch(`${SP_URL}/rest/v1/store`, {
        method: 'POST',
        headers: { 'apikey': SP_KEY, 'Authorization': `Bearer ${SP_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify({ id: 1, data: db })
      });
      if(res.ok) setSyncBadge('☁️ 已同步', false);
      else throw new Error();
    } catch(e) { setSyncBadge('⚠️ 待同步', true); }
  }

  function verifyAccess(){
    const s = document.getElementById('auth-screen');
    if(!db.adminPhone){
      s.classList.add('show');
      document.getElementById('auth-form').innerHTML = `<input id="init-p" type="tel" class="search-input" style="width:100%;margin-bottom:14px;padding:12px;" value="13590174063" placeholder="设置主房东手机号"><button class="btn" onclick="initAdmin()">绑定主账号并开启</button>`;
      return;
    }
    if(!currentPhone) currentPhone = db.adminPhone;
    const ok = (currentPhone === db.adminPhone) || (db.managers||[]).some(m => m.phone === currentPhone);
    if(ok){
      s.classList.remove('show');
      document.getElementById('role-tag').innerText = isBoss() ? '👑 主房东' : '👤 管家';
      refreshDashboard();
    } else {
      s.classList.add('show');
      document.getElementById('auth-form').innerHTML = `<input id="login-p" type="tel" class="search-input" style="width:100%;margin-bottom:14px;padding:12px;" placeholder="输入已授权手机号"><button class="btn" onclick="doLogin()">免密登录</button>`;
    }
  }

  function initAdmin(){ const p = document.getElementById('init-p').value.trim(); if(p){ db.adminPhone=p; currentPhone=p; localStorage.setItem(LOGIN_KEY,p); saveDB(); verifyAccess(); } }
  function doLogin(){ const p = document.getElementById('login-p').value.trim(); if(p===db.adminPhone || (db.managers||[]).some(m=>m.phone===p)){ currentPhone=p; localStorage.setItem(LOGIN_KEY,p); verifyAccess(); } else alert('该手机号未授权！'); }
  function logoutPhone(){ currentPhone=''; localStorage.removeItem(LOGIN_KEY); db.adminPhone=''; verifyAccess(); }

  function closeModule(){ document.getElementById('module-modal').classList.remove('show'); document.getElementById('modal-right').innerText=''; refreshDashboard(); }
  function closeLv3(){ document.getElementById('lv3-modal').classList.remove('show'); document.getElementById('lv3-right').innerText=''; }
  function closeLv4(){ document.getElementById('lv4-modal').classList.remove('show'); }
  function closeSheet(){ document.getElementById('sheet-modal').classList.remove('show'); }
  function closeDialog(){ document.getElementById('common-dialog').classList.remove('show'); }

  function refreshDashboard(){
    const total = db.rooms.length, vacant = db.rooms.filter(r=>r.status==='vacant').length;
    let exp = 0; const today = new Date();
    db.rooms.filter(r=>r.status==='rented').forEach(r => { if(r.endDate){ const d=(new Date(r.endDate)-today)/86400000; if(d<=30 && d>=-30) exp++; } });
    const due = db.bills.filter(b=>b.status!=='paid').length;
    document.getElementById('st-total').innerText = total;
    document.getElementById('st-vacant').innerText = vacant;
    document.getElementById('st-expiring').innerText = exp;
    document.getElementById('st-due').innerText = due;
    renderStatsTab();
    renderMsgTab();
    renderManagersSection();
  }

  // ==================== 一、我的房源 (楼栋二级 -> 房间红绿方格三级 -> 四Tab详情四级) ====================
  function openModule(type){
    const m = document.getElementById('module-modal'); m.classList.add('show');
    document.getElementById('modal-right').innerText = '';
    if(type === 'buildings') renderBuildingsLv2();
    else if(type === 'contracts') renderContractsPage();
    else if(type === 'recruit') renderRecruitPage();
    else if(type === 'sign') renderSignPage();
    else if(type === 'bills') renderBillsPage();
    else if(type === 'checkout') renderCheckoutHome();
    else if(type === 'repairs') renderRepairsPage();
  }

  function renderBuildingsLv2(){
    document.getElementById('modal-title').innerText = '我的房源/楼栋';
    db.buildings = db.buildings || [];
    db.rooms.forEach(r => { if(r.building && !db.buildings.includes(r.building)) db.buildings.push(r.building); });
    const cards = db.buildings.map(b => {
      const rms = db.rooms.filter(r => r.building === b);
      const vac = rms.filter(r => r.status === 'vacant').length;
      return `<div class="item-card" onclick="openBuildingRoomsLv3('${b}')">
        <div class="item-header"><span>${b}</span><span style="font-size:13px;color:var(--primary);">进入房间列表 ›</span></div>
        <div class="item-row"><span>总房间数：${rms.length}</span></div>
        <div class="item-row"><span>空房数：<strong style="color:var(--danger)">${vac}</strong></span></div>
      </div>`;
    }).join('');
    document.getElementById('modal-body').innerHTML = `
      <div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:700;font-size:15px;">🏢 楼栋 (${db.buildings.length})</span>
        <button class="btn-sm primary" style="padding:7px 14px;font-size:13px;" onclick="addBuildingPrompt()">添加楼栋</button>
      </div>
      <div class="card-list">${cards || '<div class="empty-tip">暂无楼栋，请点击右上角“添加楼栋”</div>'}</div>`;
  }

  function addBuildingPrompt(){
    const b = prompt('请输入新楼栋名称（如：5栋、32号）：');
    if(!b) return;
    if(!db.buildings.includes(b)) db.buildings.push(b);
    saveDB(); renderBuildingsLv2();
  }

  function openBuildingRoomsLv3(bldg, filter='ALL'){
    curBldg = bldg; rmFilter = filter;
    const m = document.getElementById('lv3-modal'); m.classList.add('show');
    document.getElementById('lv3-title').innerText = '房间列表';
    document.getElementById('lv3-right').innerText = '';
    renderBuildingRoomsBody();
  }

  function renderBuildingRoomsBody(){
    const today = new Date();
    const rms = db.rooms.filter(r => r.building === curBldg && (
      rmFilter === 'ALL' ||
      (rmFilter === 'vacant' && r.status === 'vacant') ||
      (rmFilter === 'rented' && r.status === 'rented') ||
      (rmFilter === 'expiring' && r.status === 'rented' && r.endDate && ((new Date(r.endDate)-today)/86400000 <= 30))
    ));

    // 按楼层分组 (例如 101->1楼, 201->2楼)
    const floors = {};
    rms.forEach(r => {
      const fl = r.floor || (r.name.length >= 3 ? r.name.slice(0, r.name.length-2) : '1');
      if(!floors[fl]) floors[fl] = [];
      floors[fl].push(r);
    });

    const cnFloor = {'1':'一楼','2':'二楼','3':'三楼','4':'四楼','5':'五楼','6':'六楼','7':'七楼','8':'八楼'};
    let gridHtml = '';
    Object.keys(floors).sort((a,b)=>Number(a)-Number(b)).forEach(fl => {
      gridHtml += `<div class="floor-title">${cnFloor[fl] || (fl+'楼')}</div><div class="room-grid-2">`;
      floors[fl].forEach(r => {
        const idx = db.rooms.findIndex(x => x.id === r.id);
        const isVac = r.status === 'vacant';
        gridHtml += `<div class="rm-box ${isVac?'vacant':'rented'}" onclick="openRoomDetailLv4(${idx})">
          <div class="rm-box-top"><span class="rm-box-no">${r.name}</span><span class="rm-tag ${isVac?'vacant':'rented'}">${isVac?'空房':'已租'}</span></div>
          <div class="rm-box-line">${r.houseType || '未录入户型'}</div>
          <div class="rm-box-line">${r.rent ? ('租金 ¥'+r.rent+'/月') : '未录入租金'}</div>
          ${isVac ? `<div class="rm-box-date">${r.vacantSince || '2026.11.01'}开始空房</div>` : `<div class="rm-box-line" style="color:#0e7a40;font-weight:600;">租客：${r.tenant}</div>`}
        </div>`;
      });
      gridHtml += `</div>`;
    });

    document.getElementById('lv3-body').innerHTML = `
      <div style="background:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);">
        <span style="font-weight:700;font-size:16px;">🏢 ${curBldg}</span>
        <button class="btn-sm primary" style="padding:7px 14px;font-size:13px;" onclick="showAddRoomSheet()">添加房间</button>
      </div>
      <div class="sub-tabs" style="top:48px;">
        <div class="sub-tab ${rmFilter==='ALL'?'active':''}" onclick="rmFilter='ALL';renderBuildingRoomsBody()">看全部房间</div>
        <div class="sub-tab ${rmFilter==='vacant'?'active':''}" onclick="rmFilter='vacant';renderBuildingRoomsBody()">只看空房</div>
        <div class="sub-tab ${rmFilter==='expiring'?'active':''}" onclick="rmFilter='expiring';renderBuildingRoomsBody()">只看快到期</div>
        <div class="sub-tab ${rmFilter==='rented'?'active':''}" onclick="rmFilter='rented';renderBuildingRoomsBody()">只看已租</div>
      </div>
      ${gridHtml || `<div class="empty-tip">暂无${rmFilter==='expiring'?'快到期':(rmFilter==='rented'?'已租':'')}房间</div>`}`;
  }

  function showAddRoomSheet(){
    const s = document.getElementById('sheet-modal'); s.classList.add('show');
    document.getElementById('sheet-body').innerHTML = `
      <div style="text-align:center;font-size:16px;padding:14px 0;border-bottom:1px solid #eee;cursor:pointer;font-weight:600;" onclick="closeSheet();bulkCreateInBldg()">一次添加多个房间</div>
      <div style="text-align:center;font-size:16px;padding:14px 0;border-bottom:1px solid #eee;cursor:pointer;font-weight:600;" onclick="closeSheet();singleCreateInBldg()">添加单个房间</div>
      <div style="text-align:center;font-size:15px;padding:14px 0;color:#888;cursor:pointer;" onclick="closeSheet()">取消</div>`;
  }

  function singleCreateInBldg(){
    const no = prompt(`在【${curBldg}】添加房间号（如 101）：`); if(!no) return;
    const rent = Number(prompt('建议月租金（元，可填0）：','1200')||0);
    db.rooms.push({ id:'RM_'+Date.now(), building:curBldg, name:no, floor:no.length>=3?no.slice(0,no.length-2):'1', rent, waterPrice:5, elecPrice:1, lastWater:0, lastElec:0, vacantSince:new Date().toISOString().slice(0,10).replace(/-/g,'.'), facilities:['空调','热水器','床'], status:'vacant' });
    saveDB(); renderBuildingRoomsBody(); renderBuildingsLv2();
  }

  function bulkCreateInBldg(){
    const fls = Number(prompt(`在【${curBldg}】批量建房 - 请输入总楼层数（如 5）：`,'5')||0);
    const per = Number(prompt('每层房间数（如 6）：','6')||0);
    const rent = Number(prompt('统一预设月租金（元）：','1200')||0);
    if(!fls || !per) return;
    const todayStr = new Date().toISOString().slice(0,10).replace(/-/g,'.');
    for(let f=1;f<=fls;f++){
      for(let r=1;r<=per;r++){
        const no = `${f}0${r}`;
        db.rooms.push({ id:'RM_'+Date.now()+'_'+f+'_'+r, building:curBldg, name:no, floor:String(f), rent, waterPrice:5, elecPrice:1, lastWater:0, lastElec:0, vacantSince:todayStr, facilities:['空调','热水器','床'], status:'vacant' });
      }
    }
    saveDB(); renderBuildingRoomsBody(); renderBuildingsLv2();
  }

  function toggleRmFac(f){
    const r = db.rooms[curRmIdx]; r.facilities = r.facilities || [];
    const i = r.facilities.indexOf(f); if(i>=0) r.facilities.splice(i,1); else r.facilities.push(f);
    saveDB(); renderRoomDetailLv4Body();
  }

  function editRoomBasicPrompt(){
    const r = db.rooms[curRmIdx];
    const ht = prompt('请输入户型（如：一室一厅、单间）：', r.houseType||'一室一厅'); if(ht===null) return;
    const rent = Number(prompt('建议月租金（元）：', r.rent||1200)||r.rent);
    const wp = Number(prompt('水费单价（元/立方）：', r.waterPrice||5)||5);
    const ep = Number(prompt('电费单价（元/度）：', r.elecPrice||1)||1);
    const lw = Number(prompt('当前水表底数：', r.lastWater||0)||0);
    const le = Number(prompt('当前电表底数：', r.lastElec||0)||0);
    r.houseType = ht; r.rent = rent; r.waterPrice = wp; r.elecPrice = ep; r.lastWater = lw; r.lastElec = le;
    saveDB(); renderRoomDetailLv4Body(); renderBuildingRoomsBody();
  }

  function uploadRoomImg(e){
    const file = e.target.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas'), sc = Math.min(1, 600/img.width);
        cv.width = img.width*sc; cv.height = img.height*sc;
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        db.rooms[curRmIdx].roomPhoto = cv.toDataURL('image/jpeg',0.65);
        saveDB(); renderRoomDetailLv4Body();
      };
      img.src = ev.target.result;
    };
    rd.readAsDataURL(file);
  }

  function deleteCurrentRoom(){
    if(!confirm('确定要删除该房间吗？')) return;
    db.rooms.splice(curRmIdx, 1);
    saveDB(); closeLv4(); renderBuildingRoomsBody(); renderBuildingsLv2();
  }

    if(d){ r.planCheckout = d; saveDB(); alert('✅ 已记录预计退租日期：'+d); renderRoomDetailLv4Body(); }

        <div><strong>计费周期：</strong>${r.billMode||'按起租日算'}</div>
        <div><strong>租金/押金：</strong>¥${r.rent}/月 | 押金 ¥${r.deposit}</div>
        <div><strong>水电单价：</strong>水 ${r.waterPrice||5}元/方 | 电 ${r.elecPrice||1}元/度</div>
        ${exTxt}
        <div><strong>合同编号：</strong>${r.contractNo||r.id.replace('RM_','2026')}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" onclick="closeDialog()">关闭</button>
        <button class="btn" onclick="copyContractText(${rmIdx})">复制合同</button>
        <button class="btn btn-danger" onclick="voidContract(${rmIdx})">作废合同</button>

  }

  function copyContractText(rmIdx){
    const r = db.rooms[rmIdx];
    const txt = `《房屋租赁合同》\n出租方：房东 (${db.adminPhone})\n承租方：${r.tenant}（电话：${r.phone}，身份证：${r.idCard||'-'}）\n承租房间：${r.building}-${r.name}\n租赁期限：${r.startDate} 至 ${r.endDate}\n月租金：¥${r.rent}元，押金：¥${r.deposit}元\n水费：${r.waterPrice||5}元/方，电费：${r.elecPrice||1}元/度`;
    navigator.clipboard.writeText(txt).then(()=>alert('✅ 电子合同全文已复制，可直接粘贴发给租客微信！'));
  }

  function voidContract(rmIdx){
    if(!confirm('如果租客信息填错，可作废合同并将房间恢复为空房。确定作废吗？')) return;
    const r = db.rooms[rmIdx];
    db.bills = db.bills.filter(b => b.roomId !== r.id || b.status === 'paid');
    r.status = 'vacant'; delete r.tenant; delete r.phone;
    saveDB(); closeDialog(); renderRoomDetailLv4Body(); renderBuildingRoomsBody();
  }

  function syncSignRoomVal(){
    const rm = db.rooms.find(r=>r.id===document.getElementById('s-rm').value);
    if(rm){ document.getElementById('s-rent').value=rm.rent||1000; document.getElementById('s-dep').value=rm.rent||1000; document.getElementById('s-wp').value=rm.waterPrice||5; document.getElementById('s-ep').value=rm.elecPrice||1; }
  }

  function uploadSignImg(e, type){
    const file = e.target.files[0]; if(!file) return;
    const arr = type==='id' ? signIdPhotos : signContractPhotos;
    if(arr.length >= (type==='id'?2:4)) return alert('照片已达上限');
    const rd = new FileReader();
    rd.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas'), sc = Math.min(1, 500/img.width);
        cv.width = img.width*sc; cv.height = img.height*sc;
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        arr.push(cv.toDataURL('image/jpeg',0.6));
        const boxId = type==='id' ? 's-id-photos' : 's-contract-photos';
        document.getElementById(boxId).innerHTML = arr.map(s=>`<img src="${s}" class="photo-item">`).join('') + `<label class="photo-add">+<br>添加照片<input type="file" accept="image/*" style="display:none" onchange="uploadSignImg(event,'${type}')"></label>`;
      };
      img.src = ev.target.result;
    };
    rd.readAsDataURL(file);
  }

  function openFeeSelectLv4(){

  function saveFeeSelectLv4(){
    EXTRA_FEE_TYPES.forEach(k => {
      const chk = document.getElementById(`chk-fee-${k}`).checked;
      if(chk && signSelectedFees[k] === undefined) signSelectedFees[k] = 30;
      if(!chk) delete signSelectedFees[k];
    });
    closeLv4();
    const box = document.getElementById('s-dynamic-fees');
    box.innerHTML = Object.keys(signSelectedFees).map(k => `
      <div class="cell-row"><span class="cell-label">${k}</span><input type="number" class="cell-input" value="${signSelectedFees[k]}" onchange="signSelectedFees['${k}']=Number(this.value)"><span style="margin-left:6px;font-size:14px;">元/月</span></div>
    `).join('');

  function submitSignContract(){
    const nm = document.getElementById('s-name').value.trim(), ph = document.getElementById('s-phone').value.trim();
    if(!nm || !ph) return alert('请填写租客姓名与手机号！');
    const rm = db.rooms.find(r=>r.id===document.getElementById('s-rm').value);
    rm.status = 'rented'; rm.tenant = nm; rm.phone = ph;
    rm.idCard = document.getElementById('s-id').value.trim();
    rm.idAddr = document.getElementById('s-addr').value.trim();
    rm.startDate = document.getElementById('s-start').value.replace(/-/g,'.');
    rm.endDate = document.getElementById('s-end').value.replace(/-/g,'.');
    rm.cycle = document.getElementById('s-cycle').value;
    rm.billMode = document.getElementById('s-billmode').value;
    rm.payDay = document.getElementById('s-payday').value;
    rm.rent = Number(document.getElementById('s-rent').value||1000);
    rm.deposit = Number(document.getElementById('s-dep').value||1000);
    rm.waterPrice = Number(document.getElementById('s-wp').value||5);
    rm.elecPrice = Number(document.getElementById('s-ep').value||1);
    rm.note = document.getElementById('s-note').value.trim();
    rm.idPhotos = [...signIdPhotos]; rm.contractPhotos = [...signContractPhotos];
    rm.extraFees = Object.keys(signSelectedFees).map(k=>({name:k, amt:Number(signSelectedFees[k]||0)}));
    rm.contractNo = new Date().toISOString().slice(0,10).replace(/-/g,'') + String(db.bills.length+1).padStart(4,'0');
    rm.signDate = new Date().toISOString().slice(0,10).replace(/-/g,'.');

name: Supabase 每日保活

on:
  schedule:
    # 每天 UTC 00:00 运行，对应北京时间每天早上 08:00
    - cron: '0 0 * * *'
  # 支持在 GitHub Actions 页面手动点击运行，方便测试验证
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: 发送轻量级只读保活查询
    runs-on: ubuntu-latest
    steps:
      - name: 校验 Secrets 配置并向 Supabase 发送轻量级只读查询
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::缺少必需的 GitHub Secrets：请在仓库 Settings -> Secrets and variables -> Actions 中配置 SUPABASE_URL 和 SUPABASE_ANON_KEY。"
            exit 1
          fi

          # 去除 URL 末尾可能多余的斜杠
          BASE_URL="${SUPABASE_URL%/}"

          # 发送轻量级只读查询，仅查询 1 条记录的 id 字段，不在日志中输出任何敏感数据
          HTTP_CODE=$(curl --silent --show-error \
            --max-time 30 \
            -o /dev/null \
            -w "%{http_code}" \
            -X GET "${BASE_URL}/rest/v1/store?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase 保活请求返回 HTTP 状态码：${HTTP_CODE}"

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Supabase 保活查询失败（HTTP ${HTTP_CODE}），请检查 SUPABASE_URL、SUPABASE_ANON_KEY 及数据表权限。"
            exit 1
          fi
